import * as THREE from 'three';

// ===== map.js =====
// map.js — STUB city (coordinator placeholder, runs the trial). BUILDER 2 owns this file:
// real coastal city, beach, downtown, highway, proper buildings. Keep this API exactly:
//
//   map.bounds {minX,maxX,minZ,maxZ}
//   map.spawnPoints { player:{x,z,heading}, car:{x,z,heading} }
//   map.groundAt(x,z) -> y
//   map.isBlocked(x,z,r) -> bool      // circle radius r vs buildings/props/water
//   map.isRoadAt(x,z) -> bool
//   map.taxiStops -> [{x,z,name}]     // road-safe, >=20 m apart, original names
//   map.update(dt)
// Coordinates: Y-up meters, ground y=0, X east, -Z north. Heading 0 = north.

function createMap({ THREE, scene }) {
  const BLOCK = 44, ROAD = 12, PITCH = BLOCK + ROAD, GRID = 2;
  // blocks centered at i*PITCH (-GRID..GRID); road center lines between and around them
  const roadCenters = [];
  for (let i = -GRID - 1; i <= GRID; i++) roadCenters.push((i + 0.5) * PITCH);
  const HALF = (GRID + 0.5) * PITCH + ROAD / 2;

  // ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(HALF * 2 + 400, HALF * 2 + 400),
    new THREE.MeshLambertMaterial({ color: 0x5d8a4f })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // roads
  const roadMat = new THREE.MeshLambertMaterial({ color: 0x33363c });
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xf5d54a });
  const roadLen = HALF * 2;
  for (const c of roadCenters) {
    const north = new THREE.Mesh(new THREE.PlaneGeometry(ROAD, roadLen), roadMat);
    north.rotation.x = -Math.PI / 2; north.position.set(c, 0.02, 0); scene.add(north);
    const east = new THREE.Mesh(new THREE.PlaneGeometry(roadLen, ROAD), roadMat);
    east.rotation.x = -Math.PI / 2; east.position.set(0, 0.02, c); scene.add(east);
    // dashed center lines
    for (let d = -HALF + 6; d < HALF - 4; d += 10) {
      const dashN = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 3), lineMat);
      dashN.rotation.x = -Math.PI / 2; dashN.position.set(c, 0.03, d); scene.add(dashN);
      const dashE = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.4), lineMat);
      dashE.rotation.x = -Math.PI / 2; dashE.position.set(d, 0.03, c); scene.add(dashE);
    }
  }

  // buildings: deterministic pseudo-random boxes per block
  const blocks = [];
  const palette = [0xd9c9a3, 0xb8c4d0, 0xc98f7a, 0x9fb4c9, 0xd6b88f, 0xa8c0a0];
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let gx = -GRID; gx <= GRID; gx++) {
    for (let gz = -GRID; gz <= GRID; gz++) {
      const n = 2 + Math.floor(rnd() * 3);
      for (let k = 0; k < n; k++) {
        const w = 8 + rnd() * 10, d = 8 + rnd() * 10, hgt = 6 + rnd() * 22;
        const x = gx * PITCH + (rnd() - 0.5) * (BLOCK - w - 6);
        const z = gz * PITCH + (rnd() - 0.5) * (BLOCK - d - 6);
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(w, hgt, d),
          new THREE.MeshLambertMaterial({ color: palette[Math.floor(rnd() * palette.length)] })
        );
        m.position.set(x, hgt / 2, z);
        scene.add(m);
        blocks.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
      }
    }
  }

  function groundAt(x, z) { return 0; }

  function isBlocked(x, z, r) {
    for (const b of blocks) {
      if (x + r > b.minX && x - r < b.maxX && z + r > b.minZ && z - r < b.maxZ) return true;
    }
    if (x < -HALF || x > HALF || z < -HALF || z > HALF) return true;
    return false;
  }

  function isRoadAt(x, z) {
    for (const c of roadCenters) {
      if (Math.abs(x - c) <= ROAD / 2 || Math.abs(z - c) <= ROAD / 2) return true;
    }
    return false;
  }

  // named, road-safe taxi stops (original names), >=20 m apart
  const taxiStops = [
    { x: roadCenters[1] + 3, z: roadCenters[2] + 3, name: 'Civic Square' },
    { x: roadCenters[4] - 3, z: roadCenters[1] + 3, name: 'Beach Gate' },
    { x: roadCenters[2] + 3, z: roadCenters[5] - 3, name: 'Harbour Road' },
    { x: roadCenters[5] - 3, z: roadCenters[4] - 3, name: 'Old Town' },
    { x: roadCenters[0] + 3, z: roadCenters[3] + 3, name: 'Palm Corner' },
  ];

  return {
    bounds: { minX: -HALF, maxX: HALF, minZ: -HALF, maxZ: HALF },
    spawnPoints: {
      player: { x: roadCenters[2] + 3, z: roadCenters[3] + 3, heading: 0 },
      car: { x: roadCenters[2] + 3, z: roadCenters[3] - 5, heading: 0 },
    },
    groundAt, isBlocked, isRoadAt, taxiStops,
    update(dt) {},
  };
}

 function drag(e){const r=stick.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width*.34),dy=(e.clientY-r.top-r.height/2)/(r.height*.34),n=Math.max(1,Math.hypot(dx,dy));sx=dx/n;sy=dy/n;if(Math.hypot(sx,sy)<.1)sx=sy=0;knob.style.transform=`translate(${sx*38}px,${sy*38}px)`;refresh();}

 const relevant=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyE']);function keydown(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(relevant.has(e.code))e.preventDefault();if(e.code==='KeyE'&&!e.repeat)onInteract();held.add(e.code);refresh();}function keyup(e){held.delete(e.code);refresh();}function reset(){held.clear();pointers.clear();joy=null;sx=sy=0;knob.style.transform='';refresh();}addEventListener('keydown',keydown);addEventListener('keyup',keyup);addEventListener('blur',reset);document.addEventListener('visibilitychange',reset);
 return{state,root,setMode(driving){action.textContent=driving?'EXIT CAR':'ENTER CAR';},setActionLabel(text){action.textContent=text;},reset,destroy(){removeEventListener('keydown',keydown);removeEventListener('keyup',keyup);removeEventListener('blur',reset);document.removeEventListener('visibilitychange',reset);root.remove();}};
}


// ===== actors.js =====
// Original primitive geometry. No external models, names, textures or paid dependencies.
function createActors({THREE:T,scene,map={},spawn={x:0,z:8},notify=()=>{},onModeChange=()=>{}}){
 const ground=(x,z)=>{const y=(map.groundAt||map.heightAt||(()=>0))(x,z);return Number.isFinite(y)?y:0;};
 const blocked=(x,z,r)=>!!((map.isBlocked||map.blockedAt||(()=>false))(x,z,r));
 const material=c=>new T.MeshLambertMaterial({color:c});const mats={skin:material('#c68b59'),shirt:material('#ecebdf'),pants:material('#26344c'),shoe:material('#152335'),body:material('#e6b32e'),dark:material('#243247'),glass:material('#71b7cb'),rubber:material('#202733'),lamp:material('#fff0b2'),rim:material('#b8c7c9'),tail:material('#ce594e')};
 const geometries=[];
 function mesh(parent,geo,mat,x=0,y=0,z=0){geometries.push(geo);const o=new T.Mesh(geo,mat);o.position.set(x,y,z);parent.add(o);return o;}

 function hull(parent,rings,mat){const vs=[],ix=[],N=12;for(const [z,w,cy,h]of rings)for(let i=0;i<N;i++){const a=i/N*Math.PI*2;vs.push(Math.cos(a)*w,cy+Math.sin(a)*h,z);}for(let j=0;j<rings.length-1;j++)for(let i=0;i<N;i++){const a=j*N+i,b=j*N+(i+1)%N,c=a+N,d=b+N;ix.push(a,b,c,b,d,c);}for(let i=1;i<N-1;i++){ix.push(0,i+1,i);const o=(rings.length-1)*N;ix.push(o,o+i,o+i+1);}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(vs,3));g.setIndex(ix);g.computeVertexNormals();return mesh(parent,g,mat);}

 const cm=new T.Group();cm.name='Original curved compact taxi';scene.add(cm);
 hull(cm,[[-1.98,.58,.69,.13],[-1.82,.83,.73,.26],[-1.22,.94,.79,.34],[.95,.94,.79,.34],[1.65,.83,.76,.28],[1.91,.62,.73,.16]],mats.body);

 function sync(){player.y=ground(player.x,player.z);car.y=ground(car.x,car.z);pm.position.set(player.x,player.y,player.z);pm.rotation.y=-player.yaw;cm.position.set(car.x,car.y,car.z);cm.rotation.y=-car.yaw;pm.visible=!driving;player.inCar=driving?car:false;car.occupied=driving;}

// ===== jobs.js =====
// Original game logic. No external assets or runtime dependencies.
function createTaxiJob({routes, getVehicle, onChange=()=>{}, initialState=null}) {
  if (!Array.isArray(routes) || routes.length < 1) throw new Error('Taxi routes required');
  const point = p => p && Number.isFinite(p.x) && Number.isFinite(p.z);
  const validRoutes = routes.filter(r => r && typeof r.id==='string' && point(r.pickup) && point(r.dropoff) && Math.hypot(r.pickup.x-r.dropoff.x,r.pickup.z-r.dropoff.z)>=20);
  if (validRoutes.length!==routes.length) throw new Error('Taxi routes need distinct, finite road-safe stops');
  const money = n => Number.isSafeInteger(n) && n>=0 && n<=100000000;
  const state = {version:1,balance:0,completed:0,routeIndex:0,phase:'idle',dwell:0,message:'Open Phone to find taxi work.',lastFare:0};
  if (initialState && initialState.version===1) {
    if(money(initialState.balance))state.balance=initialState.balance;
    if(money(initialState.completed))state.completed=initialState.completed;
    if(Number.isSafeInteger(initialState.routeIndex)&&initialState.routeIndex>=0)state.routeIndex=initialState.routeIndex%routes.length;
  }
  let changed=true,uiTimer=0,lastUiKey='';
  const route = () => routes[state.routeIndex];
  const fare = () => Math.max(30,Math.min(500,Math.round(25+Math.hypot(route().pickup.x-route().dropoff.x,route().pickup.z-route().dropoff.z)*.3)));
  const snapshot = () => {
    const target=state.phase==='pickup'?route().pickup:state.phase==='dropoff'?route().dropoff:null,v=getVehicle?.();
    const distance=target&&v&&Number.isFinite(v.x)&&Number.isFinite(v.z)?Math.hypot(v.x-target.x,v.z-target.z):null;
    const arrival=target?(v?.driving!==true?'enter-car':distance===null?'unavailable':distance>5?'travel':!Number.isFinite(v.speed)||Math.abs(v.speed)>.8?'stop':'boarding'):'idle';
    return {...state,route:route(),fare:fare(),target,distance,arrival};
  };
  function emit(){changed=true;onChange(snapshot());}
  function accept(){if(state.phase!=='idle')return false;state.phase='pickup';state.dwell=0;state.message='Drive to '+route().pickup.name+'. Stop in the marked zone.';emit();return true;}
  function cancel(){if(state.phase==='idle')return false;state.phase='idle';state.dwell=0;state.message='Taxi job canceled. No money lost.';emit();return true;}
  function update(dt){
    if(state.phase==='idle')return;
    const v=getVehicle?.(),target=state.phase==='pickup'?route().pickup:route().dropoff;
    const ready=v && v.driving===true && Number.isFinite(v.x)&&Number.isFinite(v.z)&&Number.isFinite(v.speed) && Math.hypot(v.x-target.x,v.z-target.z)<=5 && Math.abs(v.speed)<=.8;
    const step=Number.isFinite(dt)?Math.max(0,Math.min(.1,dt)):0;
    // Refresh navigation at most four times a second while travelling. No save event for distance changes.
    uiTimer+=step;if(uiTimer>=.25){uiTimer=0;const q=snapshot(),key=q.arrival+':'+Math.round(q.distance??-1);if(key!==lastUiKey){lastUiKey=key;changed=true;}}
    if(!ready){if(state.dwell!==0){state.dwell=0;emit();}return;}
    state.dwell+=step;changed=true;
    if(state.dwell<1.5)return;
    state.dwell=0;
    if(state.phase==='pickup'){
      state.phase='dropoff';state.message='Passenger aboard. Drive to '+route().dropoff.name+'.';
    } else {
      const paid=fare();state.balance=Math.min(100000000,state.balance+paid);state.completed=Math.min(100000000,state.completed+1);state.lastFare=paid;state.phase='idle';state.routeIndex=(state.routeIndex+1)%routes.length;state.message='Ride complete. Earned '+paid+' credits.';
    }
    emit();
  }
  return {accept,cancel,update,snapshot,consumeDirty(){const v=changed;changed=false;return v;},serialize(){return{version:1,balance:state.balance,completed:state.completed,routeIndex:state.routeIndex};}};
}

// ===== save.js =====
// save.js — save/load/autosave. Coordinator-owned. Contract v1.1.
// Schema v1: { version:1, savedAt, actors: actors.snapshot(), jobs: taxiJob.serialize() }
// actors.snapshot() = { version:1, player:{x,z,yaw}, car:{x,z,yaw}, driving }
// jobs serialize()  = { version:1, balance, completed, routeIndex }
// Reload intentionally cancels any active fare (builder 5's rule, avoids fake passengers).
const KEY = 'coastalcity_save_v1';

function createSave({ getActors, getJobs }) {
  let lastLoaded = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.version !== 1) return null;
      lastLoaded = data;
      return data;
    } catch (e) { return null; }
  }

  function collect() {
    const actors = getActors();
    const jobs = getJobs();
    return {
      version: 1,
      savedAt: Date.now(),
      actors: actors.snapshot(),
      jobs: jobs ? jobs.serialize() : null,
    };
  }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(collect())); }
    catch (e) { /* storage full/blocked: game keeps running */ }
  }

  function restore() {
    if (!lastLoaded) return;
    try {
      if (lastLoaded.actors) getActors().restore(lastLoaded.actors);
      // jobs state is restored through createTaxiJob initialState in main.js
    } catch (e) { /* a bad save never blocks a fresh game */ }
  }

  let timer = 0;
  function startAutosave() {
    stopAutosave();
    timer = setInterval(persist, 1000); // 1 s autosave, standing rule
  }
  function stopAutosave() { if (timer) clearInterval(timer); timer = 0; }

  return { load, collect, persist, restore, startAutosave, stopAutosave };
}


// ===== main.js =====
// main.js — game loop, camera, HUD glue, module wiring. Coordinator-owned. Contract v1.1.
// Only this file imports THREE; every module receives it (or DOM hosts) via arguments.






const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5)); // Galaxy M02s guardrail
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5e0);
scene.fog = new THREE.Fog(0x87b5e0, 120, 420);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 600);

const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x4a5d3a, 1.05);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 1.4);
sun.position.set(60, 100, 40);
scene.add(sun);

// ---- toast + fps -----------------------------------------------------------
const elFps = document.getElementById('hud-fps');
const elToast = document.getElementById('toast');
let toastTimer = 0;
function notify(msg) {
  elToast.textContent = msg;
  elToast.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { elToast.style.opacity = '0'; }, 2200);
}

// ---- module wiring (order matters: map -> controls -> actors -> jobs) ------
const map = createMap({ THREE, scene });

let paused = false;

const controls = createControls({
  container: document.getElementById('controls-root'),
  onInteract: () => { if (!paused) actors.interact(); },
});

const actors = createActors({
  THREE, scene, map,
  spawn: { x: map.spawnPoints.player.x, z: map.spawnPoints.player.z },
  notify,
  onModeChange: () => {},
});

// taxi routes: coordinator pairs map-provided road-safe stops into routes
const stops = map.taxiStops;
const routes = [];
for (let i = 0; i < stops.length; i++) {
  const a = stops[i], b = stops[(i + 2) % stops.length];
  routes.push({
    id: 'route-' + i,
    pickup: { x: a.x, z: a.z, name: a.name },
    dropoff: { x: b.x, z: b.z, name: b.name },
  });
}

let taxiJob = null;
const save = createSave({ getActors: () => actors, getJobs: () => taxiJob });
const loaded = save.load();

// world marker: coordinator renders it from job snapshots (builder 5 contract)
let marker = null;
function syncMarker(snap) {
  const target = snap.target;
  if (!target) {
    if (marker) marker.visible = false;
    return;
  }
  if (!marker) {
    marker = new THREE.Mesh(
      new THREE.CylinderGeometry(2.2, 2.2, 0.25, 24),
      new THREE.MeshBasicMaterial({ color: 0xffd23e, transparent: true, opacity: 0.7 })
    );
    scene.add(marker);
  }
  marker.visible = true;
  marker.material.color.set(snap.phase === 'pickup' ? 0xffd23e : 0x59d67a);
  marker.position.set(target.x, 0.15, target.z);
}

taxiJob = createTaxiJob({
  routes,
  getVehicle: () => ({
    x: actors.car.x, z: actors.car.z,
    speed: actors.car.speed || 0,
    driving: actors.driving === true,
  }),
  onChange: (snap) => { syncMarker(snap); save.persist(); },
  initialState: loaded && loaded.jobs ? loaded.jobs : null,
});

const phone = mountTaxiPhone({
  host: document.getElementById('phone-root'),
  job: taxiJob,
  onPause: (p) => { paused = !!p; },
  onSave: () => { save.persist(); notify('Game saved'); },
});

save.restore();          // actors snapshot back in; jobs state went in via initialState
save.startAutosave();    // every 1 s, his standing rule
syncMarker(taxiJob.snapshot());
phone.render();

// ---- camera follow ----------------------------------------------------------
const camPos = new THREE.Vector3();
const camTarget = new THREE.Vector3();
function followCamera(dt) {
  const t = actors.cameraTarget; // {x, y, z, yaw}
  const driving = actors.driving === true;
  const dist = driving ? 11 : 7, height = driving ? 4.5 : 3.2;
  const fx = Math.sin(t.yaw), fz = -Math.cos(t.yaw); // actors v002 heading convention
  camPos.set(t.x - fx * dist, (t.y || 0) + height, t.z - fz * dist);
  camera.position.lerp(camPos, Math.min(1, dt * 6));
  camTarget.set(t.x + fx * 6, (t.y || 0) + 1.5, t.z + fz * 6);
  camera.lookAt(camTarget);
}

// ---- loop -------------------------------------------------------------------
let last = performance.now();
let fpsAcc = 0, fpsN = 0, fpsShown = 0;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1; // clamp hitches
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.5) { fpsShown = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  if (!paused) {
    map.update(dt);
    actors.update(dt, controls);
    taxiJob.update(dt);
    if (marker && marker.visible) marker.rotation.y += dt; // spin marker lightly
    followCamera(dt);
  }
  if (taxiJob.consumeDirty()) phone.render();
  const kmh = Math.round(Math.abs(actors.car.speed || 0) * 3.6);
  elFps.textContent = fpsShown + ' FPS' + (actors.driving ? ' · ' + kmh + ' km/h' : '');
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('loading').style.display = 'none';
notify('Open the Phone (top right) to start taxi work');
requestAnimationFrame(frame);

</script>
