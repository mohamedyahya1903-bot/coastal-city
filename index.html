<script type="module">
import * as THREE from 'three';

// ===== map.js =====
// map.js — Solana Bay trial city (BUILDER 2). Contract v1.1 - API unchanged from the stub.
// Original layout + names throughout (inspired coastal-city arrangement, nothing copied).
// From the approved-pending trial drawing solana-bay-trial-map-v1.png / layout JSON v1:
// ocean + Sunset Strand beach west, boardwalk shops + Pelican Pier, Downtown Solana core,
// Palm Court houses east, Bayshore Highway north with one ramp, Fuel Stop, Seaside Park.
// Owner 10:13 PM: no plain box look - every building gets structure: textured facades with
// window grids + door, roof trim, and rounded roof pieces (domes, pyramids, cylinders).
// Still low-poly + one merged mesh for all roads/dashes for the Galaxy M02s budget.
// v2: buildings/props swap to Kenney CC0 GLBs (assets/models/) when a GLTFLoader is
// available (arg or importmap 'three/addons/'); primitive fallback stays otherwise.
// v6 (owner via lead Nov 19): starter bungalow + garage on the Palm Court street (Forum-Drive
// style), procedural original geometry, driveway the starter white car can park on.
// v7 (coordinator, Nov 20, standing work 1 - closest-version Los Santos layout): roads are
// centerline paths, so curved/winding/diagonal streets are possible. First new layout: winding
// Hillcrest Road climb (Palm Court -> Bayshore Highway) + denser Southside residential streets.
// Taxi stops, spawns and gameplay anchors unchanged and still road-safe.
// v7b (builder "roads", Nov 20, Phase A continued - standing work 1):
//  - Boardwalk is now a curved coastal boulevard hugging the bay (Vespucci/Del-Perro-style arc):
//    bulges toward the water mid-bay (layout x down to ~119.5), comes back to x=130 at the pier
//    so the Pelican Pier stop (132.5,300) stays 2.5 m off centerline and the pier stays walkable.
//  - East-west streets extended west to meet the arc (H200 to x=112, H280 to x=118, H360/H440 to x=124).
//  - New diagonal downtown avenue: boardwalk (132,336) -> V200/H200 corner (204,200), angled
//    skyline-street through the shop strip. Shop 2 moved to (160,390)-(186,412) to make room
//    (LOTS_L pad + building() call moved together; nine-lot tower district untouched).
//  - Bayshore Highway now a gentle curve sweeping north around the eastern hills (y 80 -> 66 mid
//    -> 84 east). Ramp (500,80) and Hillcrest junction (580,84) stay connected; Bayshore Fuel
//    stop (480,84.5) still 4.5 m off centerline (hwy w=14). North tips of V200/V280/V360/V440
//    extended to meet the curved highway centerline.
//  - Two short Southside connectors: x=310 (H440 -> south edge) and x=558 (H200 -> H280).
// Coordinator notes: none - single-file change, map API unchanged.
// v3 (owner via lead Nov 19): real elevation - analytic terrain, hills east, rise north,
// roads + highway draped on it (grades verified <=9%, drivable at 19 m/s), building lots
// flattened into pads, ground = one subdivided vertex-colored mesh. groundAt = real height.
// Coordinates: Y-up meters, y=0 at sea level, X east, -Z north. Layout (600x600, y south)
// converts as world.x = layout.x - 300, world.z = layout.y - 300. Heading 0 = north.

function createMap({ THREE, scene, GLTFLoader }) {
  const C = 300; // layout -> world offset
  const lw = (lx) => lx - C;
  const lz = (ly) => ly - C;

  // ---- merged flat quads: ALL ground planes, roads and dashes in a handful of draws ----
  const matWater = new THREE.MeshLambertMaterial({ color: 0x2e6f9e });
  const matRoad  = new THREE.MeshLambertMaterial({ color: 0x3a3e44 });
  const matHwy   = new THREE.MeshLambertMaterial({ color: 0x33373d });
  const matLine  = new THREE.MeshBasicMaterial({ color: 0xe8e4d0 });
  const matHwyLn = new THREE.MeshBasicMaterial({ color: 0xf4c430 });
  const matPier  = new THREE.MeshLambertMaterial({ color: 0xa87f4f });
  const matDrive = new THREE.MeshLambertMaterial({ color: 0x9d9a92 }); // bungalow driveway concrete

  const S = new THREE.Group(); S.name = 'fallbackBuildings'; scene.add(S); // primitive buildings until GLBs land

  // ---- terrain (owner via lead Nov 19: real elevation - hills, sloped districts, sloped highway) ----
  const smooth = (t) => { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
  const BEACH_X = lw(122); // west of here land fades to flat sand
  const LOTS_L = [ // building pads [name, x0,y0,x1,y1, heightCap] (layout coords)
    ['Tower 1',212,212,244,244,40],['Tower 2',252,212,276,240,30],['Tower 3',212,252,240,276,46],
    ['Tower 4',252,252,276,276,24],['Tower 5',292,212,324,244,34],['Tower 6',292,252,324,276,27],
    ['Office 1',212,292,244,324,20],['Office 2',252,292,276,324,17],['Office 3',292,292,324,324,20],
    ['Shop 1',160,210,186,232,8],['Shop 2',160,392,186,414,8],['Cafe',160,296,186,318,8],
    ['Shop 3',160,330,186,352,8],['Shop 4',160,366,186,388,8],
    ['House 1',460,220,480,238,5],['House 2',495,220,515,238,5],['House 3',530,220,550,238,5],
    ['House 4',460,300,480,318,5],['House 5',530,300,550,318,5],
    ['House 6',460,380,480,398,5],['House 7',495,380,515,398,5],['House 8',530,380,550,398,5],
    ['Apartments 1',380,210,410,250,14],['Apartments 2',380,290,410,330,14],['Fuel Stop',520,100,556,130,5],
    ['Starter Bungalow',494,300,516,318,5],
  ];
  const LOTS = LOTS_L.map((b) => ({ minX: lw(b[1]), maxX: lw(b[3]), minZ: lz(b[2]), maxZ: lz(b[4]) }));
  function baseH(x, z) { // gentle hills; max gradient ~7-8% anywhere (verified in test)
    const h = 3.0 * Math.sin(x * 0.009 + 1.7) * Math.cos(z * 0.008)
            + 1.8 * Math.cos(x * 0.014 - 0.6) * Math.sin(z * 0.011 + 0.9)
            + 8 * smooth((x - 140) / 240)   // Palm Court hillside, east
            + 4 * smooth((-z - 160) / 160); // rise toward Bayshore Highway, north
    return h * smooth((x - (BEACH_X - 30)) / 30); // flat sand at the waterline
  }
  for (const L of LOTS) L.padY = baseH((L.minX + L.maxX) / 2, (L.minZ + L.maxZ) / 2);
  function terrainH(x, z) { // building pads flatten inside each lot (blended inward): roads keep natural slope
    let h = baseH(x, z);
    for (const L of LOTS) {
      const d = Math.min(x - L.minX, L.maxX - x, z - L.minZ, L.maxZ - z);
      if (d <= 0) continue;
      const w = smooth(d / 6); // pad blend inward only: roads always keep the natural slope
      h = h * (1 - w) + L.padY * w;
    }
    return h;
  }

  // ocean: flat plane west of the beach
  const ocean = new THREE.Mesh(new THREE.PlaneGeometry(300, 680), matWater);
  ocean.rotation.x = -Math.PI / 2; ocean.position.set(-368, -0.25, 0); scene.add(ocean);

  // ground: one subdivided terrain-following mesh, vertex colors (sand / grass / park), one draw call
  {
    const X0 = -218, X1 = 320, Z0 = -320, Z1 = 320, NX = 60, NZ = 72; // ~8.6k tris (was 15.4k)
    const pos = [], col = [], idx = [];
    const cSand = new THREE.Color(0xe3d3a0), cGrass = new THREE.Color(0x6f9b52), cPark = new THREE.Color(0x7cb85e);
    for (let j = 0; j <= NZ; j++) for (let i = 0; i <= NX; i++) {
      const x = X0 + (X1 - X0) * i / NX, z = Z0 + (Z1 - Z0) * j / NZ;
      pos.push(x, terrainH(x, z), z);
      const c = x < BEACH_X ? cSand
        : (x >= lw(210) && x <= lw(350) && z >= lz(368) && z <= lz(432) ? cPark : cGrass);
      col.push(c.r, c.g, c.b);
    }
    for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
      const a = j * (NX + 1) + i, b = a + 1, c2 = a + NX + 1, d2 = c2 + 1;
      idx.push(a, c2, b, b, c2, d2);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx); g.computeVertexNormals();
    const groundMesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })); scene.add(groundMesh);
  }

  // Pelican Pier: walkable deck out over the water
  const pier = new THREE.Mesh(new THREE.BoxGeometry(102, 0.4, 16), matPier);
  pier.position.set(lw(71), 0.2, lz(300)); scene.add(pier);
  { // P3b (gfxfps v1): pier posts as one InstancedMesh (10 draws -> 1)
    const postGeo = new THREE.CylinderGeometry(0.5, 0.6, 2.2, 8);
    const postPos = [];
    for (let px = 24; px <= 116; px += 23) for (const pz of [293, 307]) postPos.push([lw(px), lz(pz)]);
    const posts = new THREE.InstancedMesh(postGeo, matPier, postPos.length);
    const pm4 = new THREE.Matrix4();
    postPos.forEach(([x, z], i) => { pm4.setPosition(x, -0.7, z); posts.setMatrixAt(i, pm4); });
    posts.instanceMatrix.needsUpdate = true;
    scene.add(posts);
  }

  // ---- roads (v7: centerline paths - curved/winding/diagonal streets now possible) ----
  // Every street is a path of layout-coord points [[x,y],...]; straight streets use 2 points.
  const ROADS = [
    // v7b: Boardwalk - curved coastal boulevard hugging the bay (Vespucci/Del-Perro-style arc).
    // On land (x >= ~112), x=130 at the pier so the Pelican Pier stop stays 2.5 m off centerline.
    { pts: [[134,78],[132,91.5],[130,105],[127.5,120],[125,135],[123,150],[121,165],[120.3,180],[119.5,195],[119.8,210],[120,225],[121,240],[122,255],[123.5,266.5],[125,278],[128,291],[130,300],[131,314],[132,332],[132.2,343.5],[132.3,355],[132.4,367.5],[132.5,380],[132.7,392.5],[132.8,405],[132.9,417.5],[133,430],[133.2,442.5],[133.4,455],[133.6,467.5],[133.8,480],[133.9,490],[134,500],[134,520]], w: 8 },
    { pts: [[200,74],[200,480]], w: 8 },  // v7b: north tip extended to the curved highway
    { pts: [[280,69],[280,480]], w: 8 },  // v7b: north tip extended to the curved highway
    { pts: [[360,65],[360,480]], w: 8 },  // v7b: north tip extended to the curved highway
    { pts: [[440,70],[440,480]], w: 8 },  // v7b: north tip extended to the curved highway
    { pts: [[500,80],[500,200]], w: 10 }, // highway ramp
    { pts: [[112,200],[560,200]], w: 8 }, // v7b: west end extended to meet the boardwalk arc
    { pts: [[118,280],[560,280]], w: 8 }, // v7b: west end extended to meet the boardwalk arc
    { pts: [[124,360],[560,360]], w: 8 }, // v7b: west end extended to meet the boardwalk arc
    { pts: [[124,440],[560,440]], w: 8 }, // v7b: west end extended to meet the boardwalk arc
    // v7b: diagonal downtown avenue (angled skyline-street), boardwalk -> V200/H200 corner
    { pts: [[132,336],[139.5,323.5],[147,311],[152,300],[157,289],[163.5,280.5],[170,272],[176,263],[182,254],[187,246],[192,238],[195.5,230],[199,222],[203,210],[204,200]], w: 8 },
    // v7 (Phase A, standing work 1): Southside - denser South-Los-Santos-style residential blocks
    { pts: [[245,440],[245,520]], w: 7 },
    { pts: [[375,440],[375,520]], w: 7 },
    { pts: [[130,500],[440,500]], w: 7 },
    // v7b: short Southside connectors for more varied block sizes
    { pts: [[310,440],[310,520]], w: 7 },
    { pts: [[558,200],[558,280]], w: 7 },
    // v7 (Phase A): Hillcrest Road - winding Vinewood-Hills-style climb, Palm Court -> highway
    { pts: [[500,200],[545,175],[580,140],[588,100],[580,84]], w: 7 },
  ];
  // v7b: Bayshore Highway - gentle curve sweeping north around the eastern hills; still meets
  // the ramp (x=500), the Hillcrest junction (580,84) and the Bayshore Fuel stop (480,84.5).
  const HWY = { pts: [[126,80],[144.5,79],[163,78],[181.5,77],[200,76],[218,74.8],[236,73.6],[254,72.4],[272,71.2],[290,70],[308,69.2],[326,68.4],[344,67.6],[362,66.8],[380,66],[395,67.5],[410,69],[425,70.5],[440,72],[453.3,74.7],[466.7,77.3],[480,80],[495,81],[510,82],[525,83],[540,84],[560,84],[580,84]], w: 14 };
  const DRIVES = [{ pts: [[497,284],[497,304]], w: 6 }]; // bungalow driveway (drivable, no dashes)

  // roads + highway drape the terrain: path pieces subdivided to <=step m, offset by halfW,
  // sampling terrainH, so every street follows the hills (grades verified <=9%)
  const strips = [];
  function strip(r, mat, halfW, off, step, dashLen, dashPitch) {
    const qs = [];
    for (let i = 0; i < r.pts.length - 1; i++) {
      const ax = r.pts[i][0], ay = r.pts[i][1], bx = r.pts[i + 1][0], by = r.pts[i + 1][1];
      const segLen = Math.hypot(bx - ax, by - ay);
      const ux = (bx - ax) / segLen, uy = (by - ay) / segLen;
      const nx = uy * halfW, ny = -ux * halfW; // winding matches the merge code's up-facing convention
      if (dashLen) { // dashed centerline: dashLen metres every dashPitch metres
        for (let d0 = 6; d0 + dashLen <= segLen - 2; d0 += dashPitch) {
          qs.push(quad(lw(ax + ux * d0) + uy * halfW, lz(ay + uy * d0) - ux * halfW,
                       lw(ax + ux * (d0 + dashLen)) + uy * halfW, lz(ay + uy * (d0 + dashLen)) - ux * halfW,
                       lw(ax + ux * (d0 + dashLen)) - uy * halfW, lz(ay + uy * (d0 + dashLen)) + ux * halfW,
                       lw(ax + ux * d0) - uy * halfW, lz(ay + uy * d0) + ux * halfW, off));
        }
      } else {
        for (let d0 = 0; d0 < segLen; d0 += step) {
          const d1 = Math.min(d0 + step, segLen);
          qs.push(quad(lw(ax + ux * d0) + nx, lz(ay + uy * d0) + ny,
                       lw(ax + ux * d1) + nx, lz(ay + uy * d1) + ny,
                       lw(ax + ux * d1) - nx, lz(ay + uy * d1) - ny,
                       lw(ax + ux * d0) - nx, lz(ay + uy * d0) - ny, off));
        }
      }
    }
    strips.push({ mat, qs });
  }
  function quad(x0, z0, x1, z1, x2, z2, x3, z3, off) {
    return [x0, terrainH(x0, z0) + off, z0, x1, terrainH(x1, z1) + off, z1,
            x2, terrainH(x2, z2) + off, z2, x3, terrainH(x3, z3) + off, z3];
  }
  for (const r of ROADS) strip(r, matRoad, r.w / 2, 0.04, 8, 0, 0);
  strip(HWY, matHwy, HWY.w / 2, 0.05, 8, 0, 0);
  for (const d of DRIVES) strip(d, matDrive, d.w / 2, 0.045, 4, 0, 0);
  for (const r of ROADS) strip(r, matLine, 0.2, 0.08, 8, 3, 12);
  strip(HWY, matHwyLn, 0.2, 0.09, 8, 4, 16);
  { // merge strip segments into one mesh per material
    const byMat = new Map(); const stripMeshes = [];
    for (const s of strips) {
      if (!byMat.has(s.mat)) byMat.set(s.mat, []);
      byMat.get(s.mat).push(...s.qs);
    }
    for (const [mat, qs] of byMat) {
      const pos = [], norm = [], idx = [];
      qs.forEach((q, i) => {
        const b = i * 4;
        pos.push(...q);
        const ux = q[3] - q[0], uy = q[4] - q[1], uz = q[5] - q[2];
        const vx = q[6] - q[0], vy = q[7] - q[1], vz = q[8] - q[2];
        let nx = vy * uz - vz * uy, ny = vz * ux - vx * uz, nz = vx * uy - vy * ux;
        const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
        for (let k = 0; k < 4; k++) norm.push(nx, ny, nz);
        idx.push(b, b + 2, b + 1, b, b + 3, b + 2);
      });
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
      g.setIndex(idx);
      const sm = new THREE.Mesh(g, mat); scene.add(sm); stripMeshes.push(sm);
    }
  }

  // ---- facade textures: drawn once on canvas, window grid + entrance (original art) ----
  function facadeTex(w, h, kind) {
    const pxm = 8, cw = Math.min(256, Math.max(64, Math.round(w * pxm)));
    const ch = Math.min(512, Math.max(64, Math.round(h * pxm)));
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const g = cv.getContext('2d');
    const wall = { tower: '#66788f', office: '#8395a9', apartment: '#a4b0bd',
                   shop: '#cfa871', house: '#de9873', gas: '#d46a6a', far: '#a9b8c7' }[kind] || '#999999';
    g.fillStyle = wall; g.fillRect(0, 0, cw, ch);
    const floors = Math.max(1, Math.round(h / 3));
    const cols = Math.max(1, Math.floor(w / 3.4));
    const wy = ch / floors, wx = cw / cols;
    for (let f = 0; f < floors; f++) {
      for (let c = 0; c < cols; c++) {
        const x0 = c * wx + wx * 0.22, y0 = f * wy + wy * 0.2, ww = wx * 0.56, wh = wy * 0.52;
        g.fillStyle = kind === 'far' ? 'rgba(74,94,116,0.55)' : 'rgba(20,34,52,0.9)'; // window glass
        g.beginPath(); g.roundRect(x0, y0, ww, wh, 2); g.fill();
        g.fillStyle = 'rgba(160,210,235,0.55)';                   // sky glint
        g.beginPath(); g.roundRect(x0, y0, ww, wh * 0.35, 2); g.fill();
      }
    }
    // F3a (gfxfps v1): sparse warm-lit windows on tall kinds (~9%, deterministic)
    if (kind === 'tower' || kind === 'office' || kind === 'apartment') {
      for (let f = 0; f < floors; f++) {
        for (let c = 0; c < cols; c++) {
          if ((f * 7 + c * 13 + kind.length) % 11 !== 0) continue;
          const x0 = c * wx + wx * 0.22, y0 = f * wy + wy * 0.2, ww = wx * 0.56, wh = wy * 0.52;
          g.fillStyle = 'rgba(255,214,140,0.9)';
          g.beginPath(); g.roundRect(x0, y0, ww, wh, 2); g.fill();
          g.fillStyle = 'rgba(255,236,190,0.9)';
          g.beginPath(); g.roundRect(x0, y0 + wh * 0.55, ww, wh * 0.45, 2); g.fill();
        }
      }
    }
    // ground floor: entrance door + lintel
    const dw = Math.min(cw * 0.22, 26), dx = (cw - dw) / 2, dh = Math.min(wy * 0.9, 30);
    g.fillStyle = '#2c343c'; g.fillRect(dx - 2, ch - dh - 2, dw + 4, dh + 2);
    g.fillStyle = '#4a3828'; g.fillRect(dx, ch - dh, dw, dh);
    g.fillStyle = 'rgba(160,210,235,0.5)'; g.fillRect(dx + 2, ch - dh + 2, dw - 4, dh * 0.4);
    // F3b (gfxfps v1): baked base darkening, grounds the building (not a shadow map)
    const aoH = Math.min(44, ch * 0.18);
    const ao = g.createLinearGradient(0, ch, 0, ch - aoH);
    ao.addColorStop(0, 'rgba(16,20,26,0.5)');
    ao.addColorStop(1, 'rgba(16,20,26,0)');
    g.fillStyle = ao; g.fillRect(0, ch - aoH, cw, aoH);
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  // P4 (gfxfps v1): same-kind buildings share facade textures in 2 m buckets
  const facadeCache = new Map();
  function facadeTexCached(w, h, kind) {
    const key = kind + '|' + Math.round(w / 2) * 2 + 'x' + Math.round(h / 2) * 2;
    let t = facadeCache.get(key);
    if (!t) { t = facadeTex(w, h, kind); facadeCache.set(key, t); }
    return t;
  }

  const roofMat = new THREE.MeshLambertMaterial({ color: 0x4a5058 });
  const trimMat = new THREE.MeshLambertMaterial({ color: 0xd8d4c8 });
  const doorMat = new THREE.MeshLambertMaterial({ color: 0x3a2e22 });
  const awnMat  = new THREE.MeshLambertMaterial({ color: 0xc94f4f });
  const domeMat = new THREE.MeshLambertMaterial({ color: 0x7fb7c9 });

  function lodify(obj) { // glTF PBR -> cheap Lambert, static shadows off (M02s budget)
    obj.traverse((o) => {
      if (o.isMesh) {
        if (o.geometry && !o.geometry.attributes.normal) o.geometry.computeVertexNormals(); // props ship no normals: some three versions light them black
        const col = o.geometry && o.geometry.attributes.color;
        if (col && col.itemSize === 4) { // VEC4 COLOR_0 -> vec3 (version-safe vertex colors)
          const n = col.count, a = new Float32Array(n * 3);
          for (let i = 0; i < n; i++) { a[i*3] = col.getX(i); a[i*3+1] = col.getY(i); a[i*3+2] = col.getZ(i); }
          o.geometry.setAttribute('color', new THREE.BufferAttribute(a, 3));
        }
        const m = o.material;
        o.material = new THREE.MeshLambertMaterial({
          map: m.map || null,
          color: (m.color && m.color.clone) ? m.color.clone() : new THREE.Color(0xffffff),
          transparent: m.transparent === true, opacity: m.opacity, side: m.side,
          vertexColors: m.vertexColors === true, // Mohamed's props carry vertex colors, no textures
        });
        o.castShadow = false; o.receiveShadow = false;
      }
    });
    return obj;
  }
  function fitFootprint(obj, ft, rot) { // rotate, scale uniformly into the footprint, sit on ground
    obj.rotation.y = rot;
    let box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const sx = (ft.x1 - ft.x0) / size.x, sz = (ft.y1 - ft.y0) / size.z;
    const sy = Math.min((sx + sz) / 2, (ft.h || 60) / size.y); // fill the lot, cap height
    obj.scale.set(sx, sy, sz);
    box.setFromObject(obj);
    const c = box.getCenter(new THREE.Vector3());
    const gx = lw((ft.x0 + ft.x1) / 2), gz = lz((ft.y0 + ft.y1) / 2);
    obj.position.set(gx - c.x, terrainH(gx, gz) - 0.6 - box.min.y, gz - c.z); // on its pad, sunk 0.6 foundation
    return obj;
  }
  function fitHeight(obj, x, z, rot, h) { // props: scale to a target height, sit at (x,z)
    obj.rotation.y = rot;
    let box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    obj.scale.setScalar(h / size.y);
    box.setFromObject(obj);
    const c = box.getCenter(new THREE.Vector3());
    obj.position.set(x - c.x, terrainH(x, z) - 0.15 - box.min.y, z - c.z); // prop sits on the terrain
    return obj;
  }

      ['props/bin', -146, 26, 0, 1], ['props/bin', -146, 66, 0, 1], ['props/bin', -66, -26, 0, 1],
      // hydrants downtown
      ['props/hydrant', -66, 14, 0, 0.8], ['props/hydrant', 14, -26, 0, 0.8],
      // streetlights on the downtown corners not covered by the roads kit
      ['props/streetlight', -24, 54, Math.PI, 5.5], ['props/streetlight', 66, -26, 0, 5.5],
      // traffic light at the H280 x V280 junction (the roads-kit lights cover two other junctions)
      ['props/traffic_light', -24, -104, Math.PI / 2, 4.2],
    ];
    for (const [f, x, z, rot, h] of PROPS2) placeProp(f, x, z, rot, h); // zip pending: skips silently
  }
  if (GLTFLoader) swapToModels(GLTFLoader);
  else {
    import('three/addons/loaders/GLTFLoader.js')
      .then((m) => swapToModels(m.GLTFLoader))
      .catch(() => {}); // no loader wired: stay on primitives
  }

  // P2 (gfxfps v1): freeze every static map object - none ever move; a future module that
  // moves one must re-enable matrixAutoUpdate on it. Map is created before actors, so the
  // scene holds only map statics at this point. Async GLB/prop adds freeze themselves above.
  function freeze(root) {
    root.updateMatrixWorld(true);
    root.traverse((o) => { o.matrixAutoUpdate = false; });
  }
  freeze(scene);

  // ---- API ----
  const WATER_X = lw(82);
  const PIER = { minX: lw(20), maxX: lw(122), minZ: lz(292), maxZ: lz(308) };
  const onPier = (x, z) => x >= PIER.minX && x <= PIER.maxX && z >= PIER.minZ && z <= PIER.maxZ;

  function groundAt(x, z) { return onPier(x, z) ? 0.4 : terrainH(x, z); } // real elevation

  function isBlocked(x, z, r) {
    for (const b of blocks) {
      if (x + r > b.minX && x - r < b.maxX && z + r > b.minZ && z - r < b.maxZ) return true;
    }
    if (x - r < WATER_X && !onPier(x, z)) return true;          // water (pier stays walkable)
    if (x < -C || x > C || z < -C || z > C) return true;        // world edge
    return false;
  }

  // v7: point-to-segment distance against every path piece (works for straight + curved)
  function roadHit(r, x, z) {
    const h = r.w / 2;
    for (let i = 0; i < r.pts.length - 1; i++) {
      const ax = lw(r.pts[i][0]), az = lz(r.pts[i][1]), bx = lw(r.pts[i + 1][0]), bz = lz(r.pts[i + 1][1]);
      const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz;
      let t = L2 ? ((x - ax) * dx + (z - az) * dz) / L2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const px = ax + t * dx - x, pz = az + t * dz - z;
      if (px * px + pz * pz <= h * h) return true;
    }
    return false;
  }
  function isRoadAt(x, z) {
    for (const r of ROADS) if (roadHit(r, x, z)) return true;
    for (const d of DRIVES) if (roadHit(d, x, z)) return true;
    return roadHit(HWY, x, z);
  }

  // Named, road-safe taxi stops (original names), all >>20 m apart, 2.5 m off centerline
  const taxiStops = [
    { x: lw(132.5), z: lz(300), name: 'Pelican Pier' },
    { x: lw(282.5), z: lz(240), name: 'Downtown Solana' },
    { x: lw(442.5), z: lz(320), name: 'Palm Court' },
    { x: lw(240),   z: lz(442.5), name: 'Seaside Park' },
    { x: lw(480),   z: lz(84.5),  name: 'Bayshore Fuel' },
  ];

  return {
    bounds: { minX: -C, maxX: C, minZ: -C, maxZ: C },
    spawnPoints: {
      player: { x: lw(145), z: lz(320), heading: Math.PI / 2 }, // boardwalk, facing the shops (east)
      car:    { x: lw(497), z: lz(294), heading: 0 },           // v6: starter car on the bungalow driveway, facing the street
    },
    groundAt, heightAt: groundAt,
    isBlocked, blockedAt: isBlocked,
    isRoadAt, taxiStops,
    starterHome: { x: lw(505), z: lz(309), name: 'Palm Court Bungalow' },
    // v7a (coordinator, additive): road centerlines in LAYOUT coords [[x,y],...] with width w,
    // for placement modules (houses, props, pedestrians). Convert world = layout - 300.
    roadPaths: ROADS.map((r) => ({ pts: r.pts, w: r.w })),
    // v7a: register an extra collision footprint (world coords), e.g. a placed house.
    addBlock(minX, minZ, maxX, maxZ) { blocks.push({ minX, minZ, maxX, maxZ }); },
    update(dt) {},
  };
}

// js/vehicles.js — VEHICLE VARIETY module (GTA builder: vehicles). v001.
// Original designs only: no real-world brands, no GTA vehicle names or models.
//
// COORDINATOR NOTES
// - Heading convention: this module matches the SHIPPED actors.js exactly: a vehicle's
//   FRONT is local -Z (taxi lamps sit at z=-1.82; motion at yaw=0 is -Z with
//   rotation.y=-yaw). The role brief said "forward = +Z", but the existing code and all
//   three shipped vehicles use front=-Z, so -Z wins for drop-in compatibility. Every type
//   below is built front=-Z and needs no rotation in the wiring.
// - Expected wiring (coordinator-owned): an addVehicle(typeKey, {x,z,heading})-style API
//   in actors.js that finds the entry in VEHICLE_TYPES, calls entry.make(THREE), adds the
//   returned group to the scene, and pushes a record
//   { key, mesh, leanGroup: entry.twoWheeler ? mesh.userData.leanGroup : null,
//     x, z, y:0, yaw: heading||0, speed:0, lean:0,
//     label, foot, circleR, exitR, seatY, tune }
//   into the vehicles array. make() is pure: it touches nothing outside its own group.
// - Two-wheeler handling: actors.js currently hardcodes v.key==='bike' for lean, seat-back
//   offset and rider pose. Generalize those checks to v.tune.leanMax > 0 (or a twoWheeler
//   flag copied from the type entry) so the scooter leans and seats the rider correctly.
// - Save/snapshot migration for the new keys (hatch, pickup, van, scooter) is
//   coordinator-owned (actors snapshot v2 stores per-key records; unknown keys simply have
//   no saved entry until first save).
// - Materials: all types share one cached MeshLambertMaterial palette built from
//   VEHICLE_PAINTS, so batchStatic merges across the whole vehicle and draw calls stay low.
// - Wheel pivots are child Groups named 'wheel' (tire torus + rim cylinder inside) so the
//   coordinator can spin them later; batchStatic leaves them untouched.

const VEHICLE_PAINTS = {
  red:    '#b03a2e', // hatch body
  blue:   '#2f5d8a', // pickup body
  cream:  '#e7dbc0', // van body
  teal:   '#2e8a7a', // scooter body
  dark:   '#243247', // bumpers, trim, grille
  glass:  '#2b3a47', // windows
  rubber: '#202733', // tires
  rim:    '#b8c7c9', // wheel rims
  lamp:   '#fff0b2', // headlamps
  tail:   '#ce594e', // tail lamps
  chrome: '#c3cdcf', // scooter brightwork
  black:  '#1c242e', // seats, floorboard
};

let _mats = null; // cached shared materials, built once from VEHICLE_PAINTS
function paints(THREE) {
  if (!_mats) {
    _mats = {};
    for (const k in VEHICLE_PAINTS) _mats[k] = new THREE.MeshLambertMaterial({ color: VEHICLE_PAINTS[k] });
  }
  return _mats;
}

// --- geometry helpers (same visual language as actors.js: hulls, rounded panels, torus tires) ---
function mesh(T, parent, geo, mat, x = 0, y = 0, z = 0) {
  const o = new T.Mesh(geo, mat); o.position.set(x, y, z); parent.add(o); return o;
}
function sphere(T, parent, x, y, z, rx, ry, rz, mat) {
  const o = mesh(T, parent, new T.SphereGeometry(1, 12, 8), mat, x, y, z); o.scale.set(rx, ry, rz); return o;
}
function rounded(T, parent, w, h, d, mat, x, y, z, r = Math.min(w, h, d) * .3) {
  r = Math.min(r, w * .45, h * .45, d * .45);
  const a = w / 2 - r, b = h / 2 - r, s = new T.Shape();
  s.moveTo(-a - r, -b); s.lineTo(-a - r, b); s.quadraticCurveTo(-a - r, b + r, -a, b + r);
  s.lineTo(a, b + r); s.quadraticCurveTo(a + r, b + r, a + r, b); s.lineTo(a + r, -b);
  s.quadraticCurveTo(a + r, -b - r, a, -b - r); s.lineTo(-a, -b - r);
  s.quadraticCurveTo(-a - r, -b - r, -a - r, -b);
  const g = new T.ExtrudeGeometry(s, { depth: Math.max(.005, d - 2 * r), bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: r * .45, bevelThickness: r, curveSegments: 3 });
  g.translate(0, 0, -(d - 2 * r) / 2);
  return mesh(T, parent, g, mat, x, y, z);
}
// hull: elliptical ring loft, rings = [z, halfWidth, centerY, halfHeight]
function hull(T, parent, rings, mat) {
  const vs = [], ix = [], N = 12;
  for (const [z, w, cy, h] of rings) for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2; vs.push(Math.cos(a) * w, cy + Math.sin(a) * h, z);
  }
  for (let j = 0; j < rings.length - 1; j++) for (let i = 0; i < N; i++) {
    const a = j * N + i, b = j * N + (i + 1) % N, c = a + N, d = b + N; ix.push(a, b, c, b, d, c);
  }
  for (let i = 1; i < N - 1; i++) {
    ix.push(0, i + 1, i); const o = (rings.length - 1) * N; ix.push(o, o + i, o + i + 1);
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(vs, 3));
  g.setIndex(ix); g.computeVertexNormals();
  return mesh(T, parent, g, mat);
}
// Batch direct-child meshes by material; child Groups (wheel pivots, lean) stay movable.
function batchStatic(T, group) {
  const buckets = new Map();
  for (const o of [...group.children]) if (o.isMesh) {
    o.updateMatrix();
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(o.matrix);
    const a = buckets.get(o.material) || []; a.push({ o, g }); buckets.set(o.material, a);
  }
  for (const [mat, items] of buckets) {
    if (items.length < 2) { items.forEach(i => i.g.dispose()); continue; }
    const positions = [], normals = [];
    for (const { o, g } of items) {
      positions.push(...g.attributes.position.array); normals.push(...g.attributes.normal.array);
      group.remove(o); g.dispose();
    }
    const joined = new T.BufferGeometry();
    joined.setAttribute('position', new T.Float32BufferAttribute(positions, 3));
    joined.setAttribute('normal', new T.Float32BufferAttribute(normals, 3));
    mesh(T, group, joined, mat);
  }
}
// Wheel pivot: torus tire + rim cylinder, bottom of tire rests on y=0.
// R = torus ring radius, tube = torus tube radius; pivot y = R + tube.
function wheel(T, parent, x, z, R, tube, m, rimMat) {
  const outer = R + tube;
  const pivot = new T.Group(); pivot.name = 'wheel'; pivot.position.set(x, outer, z); parent.add(pivot);
  const tire = mesh(T, pivot, new T.TorusGeometry(R, tube, 6, 12), m.rubber); tire.rotation.y = Math.PI / 2;
  const rim = mesh(T, pivot, new T.CylinderGeometry(R * .85, R * .85, tube * 1.15, 10), rimMat || m.rim);
  rim.rotation.z = Math.PI / 2;
  return pivot;
}

// Original game logic. No external assets or runtime dependencies.
// jobs.js v2: taxi work (unchanged behaviour, plus a wallet deposit for side jobs)
// and the new parcel-delivery side job (on foot or any vehicle).

function createTaxiJob({routes, getVehicle, onChange=()=>{}, initialState=null}) {
  if (!Array.isArray(routes) || routes.length < 1) throw new Error('Taxi routes required');
  const point = p => p && Number.isFinite(p.x) && Number.isFinite(p.z);
  const validRoutes = routes.filter(r => r && typeof r.id==='string' && point(r.pickup) && point(r.dropoff) && Math.hypot(r.pickup.x-r.dropoff.x,r.pickup.z-r.dropoff.z)>=20);
  if (validRoutes.length!==routes.length) throw new Error('Taxi routes need distinct, finite road-safe stops');
  const money = n => Number.isSafeInteger(n) && n>=0 && n<=100000000;
  const state = {version:1,balance:0,completed:0,routeIndex:0,phase:'idle',dwell:0,message:'Open Phone to find taxi work.',lastFare:0};
  if (initialState && initialState.version===1) {
    if(money(initialState.balance))state.balance=initialState.balance;
    if(money(initialState.completed))state.completed=initialState.completed;
    if(Number.isSafeInteger(initialState.routeIndex)&&initialState.routeIndex>=0)state.routeIndex=initialState.routeIndex%routes.length;
  }
  let changed=true,uiTimer=0,lastUiKey='';
  const route = () => routes[state.routeIndex];
  const fare = () => Math.max(30,Math.min(500,Math.round(25+Math.hypot(route().pickup.x-route().dropoff.x,route().pickup.z-route().dropoff.z)*.3)));
  const snapshot = () => {
    const target=state.phase==='pickup'?route().pickup:state.phase==='dropoff'?route().dropoff:null,v=getVehicle?.();
    const distance=target&&v&&Number.isFinite(v.x)&&Number.isFinite(v.z)?Math.hypot(v.x-target.x,v.z-target.z):null;
    const arrival=target?(v?.driving!==true?'enter-car':distance===null?'unavailable':distance>5?'travel':!Number.isFinite(v.speed)||Math.abs(v.speed)>.8?'stop':'boarding'):'idle';
    return {...state,route:route(),fare:fare(),target,distance,arrival};
  };
  function emit(){changed=true;onChange(snapshot());}
  function accept(){if(state.phase!=='idle')return false;state.phase='pickup';state.dwell=0;state.message='Drive to '+route().pickup.name+'. Stop in the marked zone.';emit();return true;}
  function cancel(){if(state.phase==='idle')return false;state.phase='idle';state.dwell=0;state.message='Taxi job canceled. No money lost.';emit();return true;}
  // Side jobs pay into this single wallet so the HUD and save keep one balance.
  function deposit(n){if(!money(n))return state.balance;state.balance=Math.min(100000000,state.balance+n);state.lastFare=n;emit();return state.balance;}
  function update(dt){
    if(state.phase==='idle')return;
    const v=getVehicle?.(),target=state.phase==='pickup'?route().pickup:route().dropoff;
    const ready=v && v.driving===true && Number.isFinite(v.x)&&Number.isFinite(v.z)&&Number.isFinite(v.speed) && Math.hypot(v.x-target.x,v.z-target.z)<=5 && Math.abs(v.speed)<=.8;
    const step=Number.isFinite(dt)?Math.max(0,Math.min(.1,dt)):0;
    // Refresh navigation at most four times a second while travelling. No save event for distance changes.
    uiTimer+=step;if(uiTimer>=.25){uiTimer=0;const q=snapshot(),key=q.arrival+':'+Math.round(q.distance??-1);if(key!==lastUiKey){lastUiKey=key;changed=true;}}
    if(!ready){if(state.dwell!==0){state.dwell=0;emit();}return;}
    state.dwell+=step;changed=true;
    if(state.dwell<1.5)return;
    state.dwell=0;
    if(state.phase==='pickup'){
      state.phase='dropoff';state.message='Passenger aboard. Drive to '+route().dropoff.name+'.';
    } else {
      const paid=fare();state.balance=Math.min(100000000,state.balance+paid);state.completed=Math.min(100000000,state.completed+1);state.lastFare=paid;state.phase='idle';state.routeIndex=(state.routeIndex+1)%routes.length;state.message='Ride complete. Earned '+paid+' credits.';

// Parcel delivery side job (v1). Walk up or drive any vehicle: collect the parcel at
// the depot, then stop inside the delivery marker. Pays into the shared taxi wallet.
function createDeliveryJob({depot, drops, getCourier, onChange=()=>{}, onPayout=()=>{}, initialState=null}) {
  const point = p => p && Number.isFinite(p.x) && Number.isFinite(p.z);
  if (!point(depot) || typeof depot.name!=='string') throw new Error('Delivery depot required');
  if (!Array.isArray(drops) || drops.length < 1) throw new Error('Delivery drops required');
  const validDrops = drops.filter(d => d && typeof d.name==='string' && point(d) && Math.hypot(d.x-depot.x,d.z-depot.z)>=20);
  if (validDrops.length!==drops.length) throw new Error('Delivery drops need distinct, finite road-safe stops');

    if(money(initialState.earned))state.earned=initialState.earned;
    if(Number.isSafeInteger(initialState.dropIndex)&&initialState.dropIndex>=0)state.dropIndex=initialState.dropIndex%drops.length;
  }
  let changed=true,uiTimer=0,lastUiKey='';
  const drop = () => drops[state.dropIndex];
  const payout = () => Math.max(25,Math.min(400,Math.round(20+Math.hypot(depot.x-drop().x,depot.z-drop().z)*.25)));

    const target=targetOf(),c=getCourier?.();
    const distance=target&&c&&Number.isFinite(c.x)&&Number.isFinite(c.z)?Math.hypot(c.x-target.x,c.z-target.z):null;
    const arrival=target?(distance===null?'unavailable':distance>5?'travel':!Number.isFinite(c.speed)||Math.abs(c.speed)>.8?'stop':'boarding'):'idle';
    return {...state,depot,drop:drop(),payout:payout(),target,distance,arrival};
  };
  function emit(){changed=true;onChange(snapshot());}
  function accept(){if(state.phase!=='idle')return false;state.phase='collect';state.dwell=0;state.message='Collect the parcel at '+depot.name+'.';emit();return true;}
  function cancel(){if(state.phase==='idle')return false;state.phase='idle';state.dwell=0;state.message='Delivery canceled. No money lost.';emit();return true;}
  function update(dt){
    if(state.phase==='idle')return;
    const c=getCourier?.(),target=targetOf();
    const ready=c && Number.isFinite(c.x)&&Number.isFinite(c.z)&&Number.isFinite(c.speed) && Math.hypot(c.x-target.x,c.z-target.z)<=5 && Math.abs(c.speed)<=.8;
    const step=Number.isFinite(dt)?Math.max(0,Math.min(.1,dt)):0;
    uiTimer+=step;if(uiTimer>=.25){uiTimer=0;const q=snapshot(),key=q.arrival+':'+Math.round(q.distance??-1);if(key!==lastUiKey){lastUiKey=key;changed=true;}}
    if(!ready){if(state.dwell!==0){state.dwell=0;emit();}return;}
    state.dwell+=step;changed=true;
    if(state.dwell<1.5)return;
    state.dwell=0;
    if(state.phase==='collect'){
      state.phase='deliver';state.message='Parcel aboard. Deliver to '+drop().name+'.';
    } else {
      const paid=payout();onPayout(paid);state.earned=Math.min(100000000,state.earned+paid);state.completed=Math.min(100000000,state.completed+1);state.lastPayout=paid;state.phase='idle';state.dropIndex=(state.dropIndex+1)%drops.length;state.message='Parcel delivered. Earned '+paid+' credits.';

// Pizza delivery side job (v1): timed. Collect at the pizzeria, then beat the timer for
// full pay; a late delivery still pays a share. Pays into the shared taxi wallet.
function createPizzaJob({shop, drops, getCourier, onChange=()=>{}, onPayout=()=>{}, initialState=null}) {
  const point = p => p && Number.isFinite(p.x) && Number.isFinite(p.z);
  if (!point(shop) || typeof shop.name!=='string') throw new Error('Pizza shop required');
  if (!Array.isArray(drops) || drops.length < 1) throw new Error('Pizza drops required');
  const validDrops = drops.filter(d => d && typeof d.name==='string' && point(d) && Math.hypot(d.x-shop.x,d.z-shop.z)>=20);
  if (validDrops.length!==drops.length) throw new Error('Pizza drops need distinct, finite road-safe stops');
  const money = n => Number.isSafeInteger(n) && n>=0 && n<=100000000;
  const state = {version:1,completed:0,onTime:0,dropIndex:0,earned:0,phase:'idle',dwell:0,timeLeft:0,limit:0,message:'Pizza delivery: beat the timer for full pay.',lastPayout:0};
  if (initialState && initialState.version===1) {
    if(money(initialState.completed))state.completed=initialState.completed;
    if(money(initialState.onTime))state.onTime=initialState.onTime;
    if(money(initialState.earned))state.earned=initialState.earned;
    if(Number.isSafeInteger(initialState.dropIndex)&&initialState.dropIndex>=0)state.dropIndex=initialState.dropIndex%drops.length;
  }
  let changed=true,uiTimer=0,lastUiKey='';
  const drop = () => drops[state.dropIndex];
  const dist = () => Math.hypot(shop.x-drop().x,shop.z-drop().z);
  const fullPay = () => Math.max(40,Math.min(600,Math.round(30+dist()*.35)));
  const limitFor = () => Math.round(25+dist()/8); // seconds; generous for 19-24 m/s roads
  const targetOf = () => state.phase==='collect'?shop:state.phase==='deliver'?drop():null;
  const snapshot = () => {
    const target=targetOf(),c=getCourier?.();
    const distance=target&&c&&Number.isFinite(c.x)&&Number.isFinite(c.z)?Math.hypot(c.x-target.x,c.z-target.z):null;
    const arrival=target?(distance===null?'unavailable':distance>5?'travel':!Number.isFinite(c.speed)||Math.abs(c.speed)>.8?'stop':'boarding'):'idle';
    return {...state,shop,drop:drop(),fullPay:fullPay(),latePay:Math.round(fullPay()*.4),target,distance,arrival};
  };
  function emit(){changed=true;onChange(snapshot());}
  function accept(){if(state.phase!=='idle')return false;state.phase='collect';state.dwell=0;state.message='Pick up the pizza at '+shop.name+'.';emit();return true;}
  function cancel(){if(state.phase==='idle')return false;state.phase='idle';state.dwell=0;state.timeLeft=0;state.message='Pizza job canceled. No money lost.';emit();return true;}
  function update(dt){
    if(state.phase==='idle')return;
    const c=getCourier?.(),target=targetOf();
    const ready=c && Number.isFinite(c.x)&&Number.isFinite(c.z)&&Number.isFinite(c.speed) && Math.hypot(c.x-target.x,c.z-target.z)<=5 && Math.abs(c.speed)<=.8;
    const step=Number.isFinite(dt)?Math.max(0,Math.min(.1,dt)):0;
    if(state.phase==='deliver'&&state.timeLeft>0){state.timeLeft=Math.max(0,state.timeLeft-step);}
    uiTimer+=step;if(uiTimer>=.25){uiTimer=0;const q=snapshot(),key=q.arrival+':'+Math.round(q.distance??-1)+':'+Math.ceil(q.timeLeft);if(key!==lastUiKey){lastUiKey=key;changed=true;}}
    if(!ready){if(state.dwell!==0){state.dwell=0;emit();}return;}
    state.dwell+=step;changed=true;
    if(state.dwell<1.5)return;
    state.dwell=0;
    if(state.phase==='collect'){
      state.phase='deliver';state.limit=limitFor();state.timeLeft=state.limit;state.message='Pizza is hot. Deliver to '+drop().name+' in '+state.limit+' s.';
    } else {
      const hot=state.timeLeft>0,paid=hot?fullPay():Math.round(fullPay()*.4);
      onPayout(paid);state.earned=Math.min(100000000,state.earned+paid);state.completed=Math.min(100000000,state.completed+1);if(hot)state.onTime=Math.min(100000000,state.onTime+1);
      state.lastPayout=paid;state.phase='idle';state.timeLeft=0;state.dropIndex=(state.dropIndex+1)%drops.length;
      state.message=(hot?'Delivered hot. Earned ':'Late, still paid. Earned ')+paid+' credits.';
    }
    emit();
  }
  return {accept,cancel,update,snapshot,consumeDirty(){const v=changed;changed=false;return v;},serialize(){return{version:1,completed:state.completed,onTime:state.onTime,dropIndex:state.dropIndex,earned:state.earned};}};
}

  }
  const key=e=>{if(isOpen){if(e.key==='Escape'){e.preventDefault();show(false);}if(e.key==='Tab'){const active=[close,...[accept,cancel,dAccept,dCancel,pAccept,pCancel].filter(b=>b&&!b.hidden)];const n=active.indexOf(document.activeElement),next=(n+(e.shiftKey?-1:1)+active.length)%active.length;e.preventDefault();active[next].focus();}e.stopImmediatePropagation();}};window.addEventListener('keydown',key,true);
  function render(){
    const s=job.snapshot(),d=delivery?delivery.snapshot():null,p=pizza?pizza.snapshot():null;
    const taxiActive=s.phase!=='idle',delActive=d&&d.phase!=='idle',pizzaActive=p&&p.phase!=='idle';

    const timeNote=pizzaActive&&p.phase==='deliver'?' · '+Math.ceil(p.timeLeft)+'s left':'';
    const guidance=!active?'':active.arrival==='enter-car'?'Enter the car to continue.':active.arrival==='stop'?'Brake and stay stopped in the marker.':active.arrival==='boarding'?(taxiActive?(s.phase==='pickup'?'Picking up passenger':'Dropping off passenger'):pizzaActive?(p.phase==='collect'?'Picking up pizza':'Handing over pizza'):(d.phase==='collect'?'Collecting parcel':'Handing over parcel'))+' · '+Math.round(Math.min(1,active.dwell/1.5)*100)+'%':active.arrival==='unavailable'?'Waiting for position.':distance?'Head to the marker · '+distance+timeNote:(timeNote?'Timer'+timeNote:'');
    $('.taxi-money').textContent=s.balance.toLocaleString()+' credits';
    $('.taxi-goal').textContent=!active?'Free roam. Open Phone to find work.':(taxiActive?(s.phase==='pickup'?'PICK UP / ':'DROP OFF / '):pizzaActive?(p.phase==='collect'?'PICK UP / ':'DELIVER / '):(d.phase==='collect'?'COLLECT / ':'DELIVER / '))+active.target.name+(distance?' · '+distance:'')+timeNote;
    $('.taxi-progress').hidden=!active;$('.taxi-progress i').style.width=active?(pizzaActive&&p.phase==='deliver'&&p.limit?(p.timeLeft/p.limit*100):(active.dwell/1.5*100))+'%':'0';
    $('.taxi-guidance').textContent=guidance;
    $('.taxi-route').textContent=s.route.pickup.name+' → '+s.route.dropoff.name;
    $('.taxi-reward').textContent='Fare: '+s.fare+' credits · Completed rides: '+s.completed;
    $('.taxi-navigation').textContent=taxiActive?guidance:'Accept a ride. No time limit.';
    accept.hidden=anyActive;cancel.hidden=!taxiActive;
    if(d){
      $('.delivery-route').textContent=d.depot.name+' → '+d.drop.name;

      $('.pizza-reward').textContent='Pay: '+p.fullPay+' hot / '+p.latePay+' late · Delivered: '+p.completed+' · On time: '+p.onTime;
      $('.pizza-navigation').textContent=pizzaActive?guidance:'Timed job. Full pay only if you beat the timer.';
      pAccept.hidden=anyActive;pCancel.hidden=!pizzaActive;

    const msg=taxiActive?s.message:pizzaActive?p.message:delActive?d.message:(s.message||'');
    if(msg!==lastMessage){$('.taxi-live').textContent=msg;lastMessage=msg;}
  }
  render();return{root,render,get open(){return isOpen;},setOpen:show,destroy(){window.removeEventListener('keydown',key,true);root.remove();onPause(false);}};
}


// ===== save.js =====
// save.js — save/load/autosave. Coordinator-owned. Contract v1.1.
// Schema v1: { version:1, savedAt, actors: actors.snapshot(), jobs: taxiJob.serialize() }
// actors.snapshot() = { version:1, player:{x,z,yaw}, car:{x,z,yaw}, driving }
// jobs serialize()  = { version:1, balance, completed, routeIndex }
// Reload intentionally cancels any active fare (builder 5's rule, avoids fake passengers).
const KEY = 'coastalcity_save_v1';

function createSave({ getActors, getJobs }) {
  let lastLoaded = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.version !== 1) return null;
      lastLoaded = data;
      return data;
    } catch (e) { return null; }
  }

  function collect() {
    const actors = getActors();
    const jobs = getJobs();
    return {
      version: 1,
      savedAt: Date.now(),
      actors: actors.snapshot(),
      jobs: jobs ? jobs.serialize() : null,
    };
  }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(collect())); }
    catch (e) { /* storage full/blocked: game keeps running */ }
  }

  function restore() {
    if (!lastLoaded) return;
    try {
      if (lastLoaded.actors) getActors().restore(lastLoaded.actors);
      // jobs state is restored through createTaxiJob initialState in main.js
    } catch (e) { /* a bad save never blocks a fresh game */ }
  }

  let timer = 0;
  function startAutosave() {
    stopAutosave();
    timer = setInterval(persist, 1000); // 1 s autosave, standing rule
  }
  function stopAutosave() { if (timer) clearInterval(timer); timer = 0; }

  return { load, collect, persist, restore, startAutosave, stopAutosave };
}


// ===== houses.js =====
// ============================================================================
// houses.js — Coastal City / Los Santos, standing work 2: "every house on every road".
// Builder module: this file ONLY. No other file is edited.
//
// Lines residential streets with original houses (closest-version Los Santos feel,
// original geometry only — no GTA assets, names or art):
//   - Hillcrest Road + Palm Court area  -> 2-storey hillside villas, domes, spanish flat roofs
//   - Southside (south of the H440 street) -> small single-storey bungalows/cottages
//   - Everywhere else residential        -> mixed bungalows, gable houses, cottages
//
// Perf (Galaxy M02s hard budget): every house part is baked into ONE merged
// BufferGeometry per material (~13 draw calls total for ALL houses, 0 per-house
// draw calls), shared MeshLambertMaterials, no shadows. Typical whole-module
// triangle cost is ~25-40k (budget 150k). update(dt) is a no-op.
//
// Procedural original geometry only. No GLTF models are loaded, so no asset
// licences are added to MODEL-SOURCES.md by this module (procedural is the
// PROJECT-BASE-preferred route). GLTFLoader is accepted in the signature for
// contract compatibility and is unused.
//
// ---- Coordinator notes ----
// Exact wiring line expected in main.js (after createMap):
//   const houses = createHouses({ THREE, scene, map, GLTFLoader });
// Optionally call houses.update(dt) in the loop (no-op today).
// houses.count = number of placed buildings; houses.placements = placement
// records (world x/z/yaw/archetype/zone) for debugging or save tooling.
// This module calls map.addBlock(minX, minZ, maxX, maxZ) for every placed
// house, so player/car collision works with no other wiring.
// ============================================================================

function createHouses({ THREE, scene, map, GLTFLoader }) { // eslint-disable-line no-unused-vars
  const C = 300;                       // layout -> world offset (world = layout - 300)
  const lw = (lx) => lx - C;
  const lz = (ly) => ly - C;

  // ---- shared materials (one draw call per material for the whole district) ----
  const MATS = {
    wall0: new THREE.MeshLambertMaterial({ color: 0xe8dcc8 }), // cream stucco
    wall1: new THREE.MeshLambertMaterial({ color: 0xdfa06e }), // terracotta
    wall2: new THREE.MeshLambertMaterial({ color: 0xa8c4d4 }), // pale blue
    wall3: new THREE.MeshLambertMaterial({ color: 0xc9d6ab }), // sage
    roof0: new THREE.MeshLambertMaterial({ color: 0x8a4a3a }), // red-brown tile
    roof1: new THREE.MeshLambertMaterial({ color: 0x5a6068 }), // slate
    roof2: new THREE.MeshLambertMaterial({ color: 0xb08a5a }), // tan
    trim:  new THREE.MeshLambertMaterial({ color: 0xf2eee2 }), // white trim
    glass: new THREE.MeshLambertMaterial({ color: 0x243b52 }), // window glass
    door:  new THREE.MeshLambertMaterial({ color: 0x5f4128 }), // wood door
    conc:  new THREE.MeshLambertMaterial({ color: 0x9d9a92 }), // concrete slabs
    brick: new THREE.MeshLambertMaterial({ color: 0x9a5a4a }), // chimney brick
    dark:  new THREE.MeshLambertMaterial({ color: 0x3a3e44 }), // flat roof deck
  };

  // ---- occupied regions (all in LAYOUT coords unless noted) ----
  // Existing lots from map.js LOTS_L — treated as occupied (brief). Keep in sync with map.js.
  const LOTS_L = [
    [212,212,244,244],[252,212,276,240],[212,252,240,276],[252,252,276,276],
    [292,212,324,244],[292,252,324,276],[212,292,244,324],[252,292,276,324],
    [292,292,324,324],[160,210,186,232],[160,240,186,262],[160,296,186,318],
    [160,330,186,352],[160,360,186,382],[460,220,480,238],[495,220,515,238],
    [530,220,550,238],[460,300,480,318],[530,300,550,318],[460,380,480,398],
    [495,380,515,398],[530,380,550,398],[380,210,410,250],[380,290,410,330],
    [520,100,556,130],[494,300,516,318],
  ];
  const LOTS_W = LOTS_L.map(([x0, y0, x1, y1]) => ({ minX: lw(x0), maxX: lw(x1), minZ: lz(y0), maxZ: lz(y1) }));
  const PARK_W = { minX: lw(210), maxX: lw(350), minZ: lz(368), maxZ: lz(432) }; // Seaside Park grass (map.js ground mesh)
  const PIER_W = { minX: lw(20), maxX: lw(122), minZ: lz(292), maxZ: lz(308) };  // Pelican Pier deck
  const WATER_X = lw(82);                                                        // water west of here (world)

  // Streets that get NO houses: the Boardwalk (shops row + beach strip) and the
  // highway ramp. Identified by their path shape (map.js ROADS, v7a).
  function skipRoad(r) {
    if (r.pts.length === 2) {
      const [a, b] = r.pts;
      if (a[0] === 130 && b[0] === 130) return true; // Boardwalk: shops row east, beach west
      if (a[0] === 500 && b[0] === 500) return true; // highway ramp
    }
    return false;
  }

  // ---- deterministic rng (stable layouts between loads/tests) ----
  let seed = 20261120 >>> 0;
  function rng() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // ---- small geometry helpers ----
  const box  = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const cyl  = (rt, rb, h, s) => new THREE.CylinderGeometry(rt, rb, h, s);
  const cone = (r, h, s) => new THREE.ConeGeometry(r, h, s, 1);
  const dome = (r) => new THREE.SphereGeometry(r, 10, 5, 0, Math.PI * 2, 0, Math.PI / 2);
  // part: geometry + material key + local translate + optional euler (applied Rz,Rx,Ry) + scale
  const P = (g, m, t, o = {}) => ({ g, m, t, ry: o.ry || 0, rx: o.rx || 0, rz: o.rz || 0, s: o.s || [1, 1, 1] });

  function win(parts, x, y, z, ry) { // window + white trim, facing local +Z rotated by ry
    const ox = Math.sin(ry), oz = Math.cos(ry);
    parts.push(P(box(1.7, 1.5, 0.1), 'trim', [x + ox * 0.02, y, z + oz * 0.02], { ry }));
    parts.push(P(box(1.4, 1.2, 0.16), 'glass', [x + ox * 0.06, y, z + oz * 0.06], { ry }));
  }
  function front(parts, w, d, twoStorey) { // door + windows on the street face (+Z), side windows
    const fx = -w * 0.22;
    parts.push(P(box(1.34, 2.5, 0.12), 'trim', [fx, 1.25, d / 2 + 0.02]));
    parts.push(P(box(1.05, 2.3, 0.18), 'door', [fx, 1.15, d / 2 + 0.07]));
    win(parts, w * 0.2, 1.7, d / 2, 0);
    if (w > 9.4) win(parts, w * 0.38, 1.7, d / 2, 0);
    win(parts, w / 2, 1.7, -d * 0.15, Math.PI / 2);
    win(parts, -w / 2, 1.7, -d * 0.15, -Math.PI / 2);
    if (twoStorey) {
      win(parts, w * 0.2, 4.5, d / 2, 0);
      win(parts, -w * 0.22, 4.5, d / 2, 0);
      win(parts, w / 2, 4.5, 0, Math.PI / 2);
      win(parts, -w / 2, 4.5, 0, -Math.PI / 2);
    }
  }
  function porch(parts, fx, d, roofM) { // slab + two round posts + flat porch roof
    parts.push(P(box(3.4, 0.18, 1.9), 'conc', [fx, 0.09, d / 2 + 0.95]));
    parts.push(P(cyl(0.12, 0.14, 2.3, 6), 'trim', [fx - 1.5, 1.32, d / 2 + 1.55]));
    parts.push(P(cyl(0.12, 0.14, 2.3, 6), 'trim', [fx + 1.5, 1.32, d / 2 + 1.55]));
    parts.push(P(box(3.7, 0.16, 2.2), roofM, [fx, 2.62, d / 2 + 1.05]));
  }
  function driveway(parts, w, d) { // concrete slab toward the street, stops ~1 m short of the road edge
    parts.push(P(box(2.8, 0.12, 3.5), 'conc', [w / 2 - 1.8, 0.06, d / 2 + 1.75]));
  }

  // ---- 6 house archetypes (all rounded shapes; footprints keep slope < 0.5 m) ----
  // Each returns { w, d, parts } in local coords: front = +Z (street side), ground y=0.
  function archBungalowHip(wall, roof) { // Southside / standard single-storey, hip roof
    const w = 9, d = 7.5, h = 3, parts = [];
    parts.push(P(box(w, h, d), wall, [0, h / 2, 0]));
    parts.push(P(box(w + 0.7, 0.22, d + 0.7), roof, [0, h, 0])); // eave
    parts.push(P(cone(Math.hypot(w, d) / 2 * 0.95, 2.2, 4), roof, [0, h + 1.1, 0], { ry: Math.PI / 4, s: [1, 1, d / w] }));
    parts.push(P(cyl(0.3, 0.34, 1.6, 6), 'brick', [w / 2 - 1.4, h + 0.9, -1]));
    front(parts, w, d, false);
    porch(parts, -w * 0.22, d, roof);
    driveway(parts, w, d);
    return { w, d, parts };
  }
  function archBungalowBarrel(wall, roof) { // small bungalow, rounded barrel-vault roof
    const w = 8.5, d = 7, h = 3, parts = [];
    parts.push(P(box(w, h, d), wall, [0, h / 2, 0]));
    parts.push(P(cyl(3.4, 3.4, w + 0.5, 10), roof, [0, h - 0.2, 0], { rz: Math.PI / 2 })); // half embedded
    parts.push(P(box(w + 0.5, 0.2, d + 0.5), 'trim', [0, h - 0.15, 0])); // trim band under the vault
    front(parts, w, d, false);
    parts.push(P(cyl(0.6, 0.6, 2.2, 8), roof, [-w * 0.22, 2.6, d / 2 + 0.4], { rz: Math.PI / 2 })); // door canopy
    parts.push(P(box(3.2, 0.16, 1.7), 'conc', [-w * 0.22, 0.08, d / 2 + 0.85]));
    driveway(parts, w, d);
    return { w, d, parts };
  }
  function archCottageDome(wall, roof) { // small rounded cottage with a dome roof
    const w = 8, d = 8, h = 3.2, parts = [];
    parts.push(P(box(w, h, d), wall, [0, h / 2, 0]));
    parts.push(P(box(w + 0.6, 0.22, d + 0.6), 'trim', [0, h, 0]));
    parts.push(P(dome(4.6), roof, [0, h + 0.05, 0], { s: [1, 0.62, 1] }));
    parts.push(P(cyl(0.28, 0.32, 1.3, 6), 'brick', [-w / 2 + 1.3, h + 0.6, -1.5]));
    front(parts, w, d, false);
    porch(parts, -w * 0.22, d, roof);
    driveway(parts, w, d);
    return { w, d, parts };
  }
  function archSpanish(wall, roof) { // flat roof + parapet, dome over the entrance, columns
    const w = 10, d = 8, h = 3.4, parts = [];
    parts.push(P(box(w, h, d), wall, [0, h / 2, 0]));
    parts.push(P(box(w - 0.2, 0.12, d - 0.2), 'dark', [0, h + 0.04, 0])); // roof deck
    parts.push(P(box(w + 0.4, 0.55, 0.25), wall, [0, h + 0.24, d / 2 + 0.07]));  // parapets
    parts.push(P(box(w + 0.4, 0.55, 0.25), wall, [0, h + 0.24, -d / 2 - 0.07]));
    parts.push(P(box(0.25, 0.55, d + 0.4), wall, [w / 2 + 0.07, h + 0.24, 0]));
    parts.push(P(box(0.25, 0.55, d + 0.4), wall, [-w / 2 - 0.07, h + 0.24, 0]));
    parts.push(P(dome(1.7), roof, [-w * 0.22, h + 0.1, d / 2 - 1.3], { s: [1, 0.75, 1] }));
    parts.push(P(cyl(0.16, 0.18, 2.6, 8), 'trim', [-w * 0.22 - 1.4, 1.3, d / 2 + 1.3])); // porch columns
    parts.push(P(cyl(0.16, 0.18, 2.6, 8), 'trim', [-w * 0.22 + 1.4, 1.3, d / 2 + 1.3]));
    parts.push(P(box(3.6, 0.35, 0.6), 'trim', [-w * 0.22, 2.75, d / 2 + 1.3]));
    parts.push(P(box(3.6, 0.16, 2.1), 'conc', [-w * 0.22, 0.08, d / 2 + 1.0]));
    front(parts, w, d, false);
    driveway(parts, w, d);
    return { w, d, parts };
  }
  function archGable2(wall, roof) { // 2-storey gable house, triangular prism roof
    const w = 9.5, d = 8, h = 5.4, parts = [];
    parts.push(P(box(w, h, d), wall, [0, h / 2, 0]));
    parts.push(P(box(w + 0.5, 0.25, d + 0.5), 'trim', [0, 2.95, 0])); // floor band
    parts.push(P(box(w + 0.6, 0.25, d + 0.6), 'trim', [0, h, 0]));     // eave
    const r = d / (2 * 0.866), sy = 0.45; // ridge-up triangular prism, squashed
    parts.push(P(cyl(r, r, w + 0.5, 3, 1, false, Math.PI / 2), roof, [0, h + 0.5 * r * sy, 0], { rz: Math.PI / 2, s: [1, sy, 1] }));
    parts.push(P(cyl(0.3, 0.34, 1.8, 6), 'brick', [w / 2 - 1.5, h + 1.4, 0]));
    front(parts, w, d, true);
    porch(parts, -w * 0.22, d, roof);
    driveway(parts, w, d);
    return { w, d, parts };
  }
  function archVilla(wall, roof) { // Hillcrest / Palm Court 2-storey villa, balcony + columns
    const w = 11, d = 8.5, parts = [];
    parts.push(P(box(w, 3.1, d), wall, [0, 1.55, 0]));
    parts.push(P(box(w - 1, 2.9, d - 1), wall, [0, 3.1 + 1.45, 0]));
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) // rounded corner columns
      parts.push(P(cyl(0.2, 0.24, 3.1, 6), 'trim', [sx * (w / 2 - 0.05), 1.55, sz * (d / 2 - 0.05)]));
    parts.push(P(box(w - 1 + 0.7, 0.25, d - 1 + 0.7), roof, [0, 6, 0])); // eave
    parts.push(P(cone(Math.hypot(w - 1, d - 1) / 2 * 0.95, 2.4, 4), roof, [0, 6 + 1.2, 0], { ry: Math.PI / 4, s: [1, 1, (d - 1) / (w - 1)] }));
    parts.push(P(box(4.4, 0.16, 1.4), 'conc', [0.8, 3.2, (d - 1) / 2 + 0.62])); // balcony slab
    for (const bx of [-1.1, 0.8, 2.7])
      parts.push(P(cyl(0.05, 0.05, 0.95, 5), 'trim', [bx, 3.75, (d - 1) / 2 + 1.25]));
    parts.push(P(cyl(0.06, 0.06, 4.3, 6), 'trim', [0.8, 4.25, (d - 1) / 2 + 1.25], { rz: Math.PI / 2 })); // rail
    parts.push(P(cyl(0.3, 0.34, 1.6, 6), 'brick', [-w / 2 + 1.6, 6 + 0.8, -1.5]));
    front(parts, w, d, true);
    porch(parts, -w * 0.22, d, roof);
    driveway(parts, w, d);
    return { w, d, parts };
  }

  const WALLS = ['wall0', 'wall1', 'wall2', 'wall3'];
  const ROOFS = ['roof0', 'roof1', 'roof2'];
  const ARCHS = {
    bungalow: [archBungalowHip, archBungalowBarrel],
    cottage:  [archCottageDome],
    villa:    [archVilla, archGable2, archSpanish, archCottageDome],
    mixed:    [archBungalowHip, archBungalowBarrel, archCottageDome, archSpanish, archGable2],
    south:    [archBungalowHip, archBungalowBarrel, archCottageDome],
  };
  function pickArch(zone) {
    const list = ARCHS[zone] || ARCHS.mixed;
    const f = list[Math.floor(rng() * list.length) % list.length];
    const wall = WALLS[Math.floor(rng() * WALLS.length) % WALLS.length];
    const roof = ROOFS[Math.floor(rng() * ROOFS.length) % ROOFS.length];
    const a = f(wall, roof);
    a.kind = f.name.replace('arch', '').toLowerCase();
    return a;
  }

  // ---- street walking (all math in WORLD coords; roadPaths arrive in LAYOUT) ----
  function walker(ptsLayout) {
    const segs = []; let total = 0;
    for (let i = 0; i < ptsLayout.length - 1; i++) {
      const ax = lw(ptsLayout[i][0]), az = lz(ptsLayout[i][1]);
      const bx = lw(ptsLayout[i + 1][0]), bz = lz(ptsLayout[i + 1][1]);
      const len = Math.hypot(bx - ax, bz - az);
      if (len < 1e-6) continue;
      segs.push({ ax, az, ux: (bx - ax) / len, uz: (bz - az) / len, len, start: total });
      total += len;
    }
    return {
      total,
      at(s) {
        let g = segs[segs.length - 1];
        for (const sg of segs) { if (s <= sg.start + sg.len) { g = sg; break; } }
        const d = Math.min(Math.max(s - g.start, 0), g.len);
        return { x: g.ax + g.ux * d, z: g.az + g.uz * d, ux: g.ux, uz: g.uz };
      },
    };
  }

  function zoneAt(cx, cz, winding) {
    if (winding) return 'villa';                          // Hillcrest Road: hillside villas
    if (cz > lz(442)) return 'south';                     // Southside bungalows
    if (cx > lw(445)) return 'villa';                     // Palm Court hillside
    return 'mixed';
  }

  const inRect = (r, x, z) => x >= r.minX && x <= r.maxX && z >= r.minZ && z <= r.maxZ;
  const overlap = (a, b, m) => a.minX - m < b.maxX && a.maxX + m > b.minX && a.minZ - m < b.maxZ && a.maxZ + m > b.minZ;

  const placed = [];      // world AABBs of placed houses (for house-house spacing)
  const placements = [];  // records returned for debugging/save tooling
  const MAX_HOUSES = 150;

  // A house is valid only if its whole footprint is off-road (4 corners + 4 edge
  // midpoints through map.isRoadAt), on land (not water/pier/park), slope across
  // the footprint <= 0.5 m (map.groundAt at the corners), and clear of existing
  // lots (4 m) and other placed houses (2 m).
  function validFootprint(cx, cz, w, d, yaw) {
    const hw = w / 2, hd = d / 2, co = Math.cos(yaw), si = Math.sin(yaw);
    const local = [[hw, hd], [-hw, hd], [hw, -hd], [-hw, -hd], [hw, 0], [-hw, 0], [0, hd], [0, -hd]];
    let gMin = Infinity, gMax = -Infinity;
    for (let i = 0; i < local.length; i++) {
      const lx0 = local[i][0], lz0 = local[i][1];
      const x = cx + lx0 * co + lz0 * si;
      const z = cz - lx0 * si + lz0 * co;
      if (map.isRoadAt(x, z)) return null;
      if (x < WATER_X + 1) return null;                    // water / beach strip
      if (inRect(PIER_W, x, z) || inRect(PARK_W, x, z)) return null;
      if (i < 4) { const g = map.groundAt(x, z); if (g < gMin) gMin = g; if (g > gMax) gMax = g; }
    }
    if (gMax - gMin > 0.5) return null;                    // too steep for a pad
    const ex = hw * Math.abs(co) + hd * Math.abs(si);
    const ez = hw * Math.abs(si) + hd * Math.abs(co);
    const bb = { minX: cx - ex, maxX: cx + ex, minZ: cz - ez, maxZ: cz + ez };
    if (bb.minX < -298 || bb.maxX > 298 || bb.minZ < -298 || bb.maxZ > 298) return null;
    for (const l of LOTS_W) if (overlap(bb, l, 4)) return null;  // existing buildings keep their space
    for (const h of placed) if (overlap(bb, h, 2)) return null;  // 2 m gap between new houses
    return bb;
  }

  // ---- merged-geometry baking (rotations: part Rz,Rx,Ry then house Ry + translate) ----
  const buckets = new Map(); // matKey -> { pos: [], norm: [] }
  function bakePart(part, hx, hy, hz, yaw) {
    const src = part.g.index ? part.g.toNonIndexed() : part.g;
    const pos = src.attributes.position.array, nrm = src.attributes.normal.array;
    let b = buckets.get(part.m);
    if (!b) { b = { pos: [], norm: [] }; buckets.set(part.m, b); }
    const [sx, sy, sz] = part.s;
    const c1 = Math.cos(part.rz), s1 = Math.sin(part.rz);
    const c2 = Math.cos(part.rx), s2 = Math.sin(part.rx);
    const c3 = Math.cos(part.ry), s3 = Math.sin(part.ry);
    const cH = Math.cos(yaw), sH = Math.sin(yaw);
    const [tx, ty, tz] = part.t;
    for (let i = 0; i < pos.length; i += 3) {
      // scale
      let x = pos[i] * sx, y = pos[i + 1] * sy, z = pos[i + 2] * sz;
      let nx = nrm[i] / sx, ny = nrm[i + 1] / sy, nz = nrm[i + 2] / sz;
      // part Rz
      let x2 = x * c1 - y * s1, y2 = x * s1 + y * c1, z2 = z;
      let nx2 = nx * c1 - ny * s1, ny2 = nx * s1 + ny * c1, nz2 = nz;
      // part Rx
      let y3 = y2 * c2 - z2 * s2, z3 = y2 * s2 + z2 * c2, x3 = x2;
      let ny3 = ny2 * c2 - nz2 * s2, nz3 = ny2 * s2 + nz2 * c2, nx3 = nx2;
      // part Ry
      let x4 = x3 * c3 + z3 * s3, z4 = -x3 * s3 + z3 * c3, y4 = y3;
      let nx4 = nx3 * c3 + nz3 * s3, nz4 = -nx3 * s3 + nz3 * c3, ny4 = ny3;
      // part translate
      x4 += tx; y4 += ty; z4 += tz;
      // house Ry + translate
      const X = hx + x4 * cH + z4 * sH;
      const Z = hz - x4 * sH + z4 * cH;
      b.pos.push(X, hy + y4, Z);
      const NX = nx4 * cH + nz4 * sH;
      const NZ = -nx4 * sH + nz4 * cH;
      const nl = Math.hypot(NX, ny4, NZ) || 1;
      b.norm.push(NX / nl, ny4 / nl, NZ / nl);
    }
    if (src !== part.g) src.dispose();
    part.g.dispose();
  }

  // ---- placement pass ----
  let count = 0;
  // Priority order: signature streets first (Hillcrest winding climb, Southside lanes,
  // Palm Court street), then the general grid, so the MAX_HOUSES cap trims generic
  // blocks rather than starving the streets the brief names.
  const roads = [...map.roadPaths].sort((a, b) => rank(a) - rank(b));
  function rank(r) {
    if (r.pts.length > 2) return 0;                       // Hillcrest Road
    const ys = r.pts.map((p) => p[1]);
    if (Math.min(...ys) >= 440) return 1;                 // Southside lanes
    if (r.pts.length === 2 && r.pts[0][0] === 440 && r.pts[1][0] === 440) return 2; // Palm Court street
    return 3;
  }
  for (const road of roads) {
    if (skipRoad(road) || count >= MAX_HOUSES) continue;
    const walk = walker(road.pts);
    const frontOff = road.w / 2 + 4.5;             // front wall 8-8.5 m off centerline (w 7..8)
    const winding = road.pts.length > 2;
    let s = 9;
    while (s < walk.total - 9 && count < MAX_HOUSES) {
      const p = walk.at(s);
      let widest = 9;
      for (const side of [-1, 1]) {
        if (count >= MAX_HOUSES) break;
        const nx = -p.uz * side, nz = p.ux * side; // unit normal, world coords
        const zone = zoneAt(p.x + nx * 12, p.z + nz * 12, winding);
        let arch = pickArch(zone);
        let coff = frontOff + arch.d / 2;
        let cx = p.x + nx * coff, cz = p.z + nz * coff;
        const yaw = Math.atan2(-nx, -nz);          // local +Z (front) faces the street
        let bb = validFootprint(cx, cz, arch.w, arch.d, yaw);
        if (!bb && arch.kind !== 'cottagedome') {  // steep/tight spot: retry the smallest footprint
          arch = archCottageDome(WALLS[Math.floor(rng() * WALLS.length) % WALLS.length],
                                 ROOFS[Math.floor(rng() * ROOFS.length) % ROOFS.length]);
          arch.kind = 'cottagedome';
          coff = frontOff + arch.d / 2;
          cx = p.x + nx * coff; cz = p.z + nz * coff;
          bb = validFootprint(cx, cz, arch.w, arch.d, yaw);
        }
        if (!bb) continue;
        const gy = map.groundAt(cx, cz);
        for (const part of arch.parts) bakePart(part, cx, gy - 0.3, cz, yaw); // sunk 0.3 foundation
        map.addBlock(bb.minX, bb.minZ, bb.maxX, bb.maxZ);
        placed.push(bb);
        placements.push({ x: cx, z: cz, y: gy, yaw, w: arch.w, d: arch.d, archetype: arch.kind, zone });
        count++;
        if (arch.w > widest) widest = arch.w;
      }
      s += widest + 3.5;                           // house width + side gap
    }
  }

  // ---- one merged mesh per material ----
  let triTotal = 0;
  const group = new THREE.Group(); group.name = 'houses';
  for (const [mk, b] of buckets) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(b.norm, 3));
    const mesh = new THREE.Mesh(g, MATS[mk]);
    mesh.matrixAutoUpdate = false;
    group.add(mesh);
    triTotal += b.pos.length / 9;
  }
  scene.add(group);

  return {
    update(dt) {}, // static district: nothing per-frame (dt unused)
    count,
    placements,
    stats: { drawCalls: buckets.size, triangles: Math.round(triTotal) },
  };
}


// ===== adaptive-resolution.js =====
// adaptive-resolution.js — NEW drop-in module (complete file). Graphics+FPS builder, v1.
// No THREE import (project module discipline): the renderer arrives as an argument.
// Used by patches-main.js P1: main.js does
//   import { createAdaptiveResolution } from './adaptive-resolution.js';
// and calls adaptive.sample(rawDt) once per frame with the UNCLAMPED frame delta.
//
// Behaviour: EMA of frame time; when the average stays slower than ~33 ms the render
// pixel ratio steps down (1.0 -> 0.85 -> 0.75), when it stays faster than ~57 fps it
// steps up (toward 1.25). One step per 1.5 s (hysteresis) so it cannot oscillate.
// The 1.5 hard cap from the project brief is respected: max defaults to 1.25.
// Guards: a 30-sample warmup (loading hitches must not pick a ratio), and a single
// frame longer than 250 ms is clamped so one tab-switch hitch can't force a down-step;
// sustained slowness still steps down from the second slow frame on.

function createAdaptiveResolution({ renderer, min = 0.75, max = 1.25, start = 1 }) {
  let cur = start;
  let ema = 1 / 45; // mid-band start: steady state, not the first frames, picks the ratio
  let cooldown = 0;
  let warm = 30;

  function apply() {
    renderer.setPixelRatio(cur);
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  renderer.setPixelRatio(cur);

  return {
    sample(dt) {
      const d = dt > 0.25 ? 0.25 : dt; // clamp one-off hitches
      ema = ema * 0.95 + d * 0.05;
      if (warm > 0) { warm--; return; }
      cooldown -= dt;
      if (cooldown > 0) return;
      if (ema > 1 / 33 && cur > min) {
        cur = Math.max(min, Math.round((cur - 0.15) * 100) / 100);
        apply();
        cooldown = 1.5;
      } else if (ema < 1 / 57 && cur < max) {
        cur = Math.min(max, Math.round((cur + 0.1) * 100) / 100);
        apply();
        cooldown = 1.5;
      }
    },
    get current() { return cur; },
  };
}

// map v3 Kenney assets ride as ONE pack of .b64 chunks (GitHub's web UI rejects binary
// uploads, and 46 separate chunk-sets would mean 50 editor commits; the pack is 20).
async function loadAssetPack(prefix) {
  const parts = [];
  for (let i = 0; ; i++) {
    const part = await fetch(prefix + '.' + String(i).padStart(2, '0'));
    if (!part.ok) break;
    parts.push(await part.text());
  }
  if (!parts.length) return {};
  const bin = atob(parts.join('').replace(/\s+/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const mlen = new DataView(bytes.buffer).getUint32(0, true);
  const manifest = JSON.parse(new TextDecoder().decode(bytes.subarray(4, 4 + mlen)));
  const start = 4 + mlen, blobs = {};
  for (const [path, [off, len]] of Object.entries(manifest)) {
    blobs[path] = URL.createObjectURL(new Blob([bytes.subarray(start + off, start + off + len)],
      { type: path.endsWith('.png') ? 'image/png' : 'model/gltf-binary' }));
  }
  return blobs;
}

const camPos = new THREE.Vector3();
const camTarget = new THREE.Vector3();
function followCamera(dt) {
  const t = actors.cameraTarget; // {x, y, z, yaw}
  const driving = actors.driving === true;
  const dist = driving ? 11 : 7, height = driving ? 4.5 : 3.2;
  const fx = Math.sin(t.yaw), fz = -Math.cos(t.yaw); // actors v002 heading convention
  camPos.set(t.x - fx * dist, (t.y || 0) + height, t.z - fz * dist);
  camera.position.lerp(camPos, Math.min(1, dt * 6));
  camTarget.set(t.x + fx * 6, (t.y || 0) + 1.5, t.z + fz * 6);
  camera.lookAt(camTarget);
}

let last = performance.now();
let fpsAcc = 0, fpsN = 0, fpsShown = 0;
let lastHud = ''; // P7

function frame(now) {
  requestAnimationFrame(frame);
  const rawDt = (now - last) / 1000;
  last = now;
  let dt = rawDt;
  if (dt > 0.1) dt = 0.1; // clamp hitches
  adaptive.sample(rawDt); // P1: scale render resolution to the measured frame time
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.5) { fpsShown = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  if (!paused) {
    map.update(dt);
    actors.update(dt, controls.state);
    taxiJob.update(dt);
    deliveryJob.update(dt);
    pizzaJob.update(dt);
    if (marker && marker.visible) marker.rotation.y += dt; // spin marker lightly
    if (deliveryMarker && deliveryMarker.visible) deliveryMarker.rotation.y += dt;
    if (pizzaMarker && pizzaMarker.visible) pizzaMarker.rotation.y += dt;
    followCamera(dt);
  }
  if (taxiJob.consumeDirty() | deliveryJob.consumeDirty() | pizzaJob.consumeDirty()) phone.render();
  const kmh = Math.round(Math.abs(actors.current.speed || 0) * 3.6); // v009: speed of the vehicle being driven (taxi/sedan/bike)
  const hudText = fpsShown + ' FPS' + (actors.driving ? ' · ' + kmh + ' km/h' : '');
  if (hudText !== lastHud) { elFps.textContent = hudText; lastHud = hudText; } // P7: write-on-change
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// GitHub's web UI can't process these binaries, so the GLBs are committed as .b64 text;
// decode to blob URLs and hand builder 7's loader a subclass that maps the plain paths.
async function glbURL(path) {
  let r = await fetch(path + '.b64');
  let b64 = '';
  if (r.ok) {
    b64 = await r.text();
  } else {
    // big files are committed as numbered parts (240 KB each, GitHub editor limit)
    for (let i = 0; ; i++) {
      const part = await fetch(path + '.b64.0' + i);
      if (!part.ok) { if (i === 0) return path; break; } // a real GLB committed later wins automatically
      b64 += await part.text();
    }
  }
  b64 = b64.replace(/\s+/g, '');
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: 'model/gltf-binary' }));
}
const modelBlobs = {};
for (const p of ['./models/player-vest-cc0.glb', './models/taxi.glb']) modelBlobs[p] = await glbURL(p);
class RepoGLTFLoader extends GLTFLoader {
  loadAsync(url, onProgress) {
    return super.loadAsync(modelBlobs[url] || url, onProgress);
  }
}

// load the CC0 models before hiding the loader (builder 7 v007); report failures, don't fall back silently
try {
  await actors.loadModels({ GLTFLoader: RepoGLTFLoader, baseURL: './models/' });
} catch (err) {
  const el = document.querySelector('#loading .sub');
  if (el) el.textContent = '3D models failed to load (' + (err && err.message ? err.message : 'network') + ') - showing simple shapes';
  await new Promise((r) => setTimeout(r, 2500));
}

document.getElementById('loading').style.display = 'none';
notify('Open the Phone (top right) to find work');
requestAnimationFrame(frame);

</script>
