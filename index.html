<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b1a2a;

    -webkit-user-select:none; user-select:none; }
  #game { position:fixed; inset:0; display:block; }
  .hud { position:fixed; z-index:10; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.8); pointer-events:none; }
  #hud-fps { top:calc(8px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:13px; opacity:.85; }
  #toast { top:24%; left:50%; transform:translateX(-50%); font-size:17px; font-weight:bold;
    background:rgba(0,0,0,.65); padding:8px 18px; border-radius:16px; opacity:0; transition:opacity .25s; }
  #controls-root { position:fixed; inset:0; z-index:20; pointer-events:none; }
  #phone-root { position:fixed; inset:0; z-index:30; pointer-events:none; }
  #phone-root button, #phone-root .taxi-backdrop { pointer-events:auto; }
  #loading { position:fixed; inset:0; z-index:100; background:#0b1a2a; display:flex;
    flex-direction:column; align-items:center; justify-content:center; color:#fff; }
  #loading .title { font-size:34px; font-weight:bold; color:#ffd23e; letter-spacing:1px; }
  #loading .sub { margin-top:10px; font-size:14px; opacity:.8; }
  #loading .bar { margin-top:22px; width:200px; height:8px; background:#223; border-radius:4px; overflow:hidden; }
  #loading .bar i { display:block; height:100%; width:40%; background:#ffd23e; border-radius:4px;

<body>
<canvas id="game"></canvas>
<div id="hud-fps" class="hud"></div>

<div id="loading"><div class="title">COASTAL CITY</div><div class="sub">loading…</div><div class="bar"><i></i></div></div>
<script type="module">
import * as THREE from 'three';

// ===== map.js =====
// map.js — Solana Bay trial city (BUILDER 2). Contract v1.1 - API unchanged from the stub.
// Original layout + names throughout (inspired coastal-city arrangement, nothing copied).
// From the approved-pending trial drawing solana-bay-trial-map-v1.png / layout JSON v1:
// ocean + Sunset Strand beach west, boardwalk shops + Pelican Pier, Downtown Solana core,
// Palm Court houses east, Bayshore Highway north with one ramp, Fuel Stop, Seaside Park.
// Owner 10:13 PM: no plain box look - every building gets structure: textured facades with
// window grids + door, roof trim, and rounded roof pieces (domes, pyramids, cylinders).
// Still low-poly + one merged mesh for all roads/dashes for the Galaxy M02s budget.
// v2: buildings/props swap to Kenney CC0 GLBs (assets/models/) when a GLTFLoader is
// available (arg or importmap 'three/addons/'); primitive fallback stays otherwise.
// v6 (owner via lead Nov 19): starter bungalow + garage on the Palm Court street (Forum-Drive
// style), procedural original geometry, driveway the starter white car can park on.
// v3 (owner via lead Nov 19): real elevation - analytic terrain, hills east, rise north,
// roads + highway draped on it (grades verified <=9%, drivable at 19 m/s), building lots
// flattened into pads, ground = one subdivided vertex-colored mesh. groundAt = real height.
// Coordinates: Y-up meters, y=0 at sea level, X east, -Z north. Layout (600x600, y south)
// converts as world.x = layout.x - 300, world.z = layout.y - 300. Heading 0 = north.

function createMap({ THREE, scene, GLTFLoader }) {
  const C = 300; // layout -> world offset
  const lw = (lx) => lx - C;
  const lz = (ly) => ly - C;

  // ---- merged flat quads: ALL ground planes, roads and dashes in a handful of draws ----
  const matWater = new THREE.MeshLambertMaterial({ color: 0x2e6f9e });
  const matRoad  = new THREE.MeshLambertMaterial({ color: 0x3a3e44 });
  const matHwy   = new THREE.MeshLambertMaterial({ color: 0x33373d });
  const matLine  = new THREE.MeshBasicMaterial({ color: 0xe8e4d0 });
  const matHwyLn = new THREE.MeshBasicMaterial({ color: 0xf4c430 });
  const matPier  = new THREE.MeshLambertMaterial({ color: 0xa87f4f });
  const matDrive = new THREE.MeshLambertMaterial({ color: 0x9d9a92 }); // bungalow driveway concrete

  const S = new THREE.Group(); S.name = 'fallbackBuildings'; scene.add(S); // primitive buildings until GLBs land

  // ---- terrain (owner via lead Nov 19: real elevation - hills, sloped districts, sloped highway) ----
  const smooth = (t) => { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
  const BEACH_X = lw(122); // west of here land fades to flat sand
  const LOTS_L = [ // building pads [name, x0,y0,x1,y1, heightCap] (layout coords)
    ['Tower 1',212,212,244,244,40],['Tower 2',252,212,276,240,30],['Tower 3',212,252,240,276,46],
    ['Tower 4',252,252,276,276,24],['Tower 5',292,212,324,244,34],['Tower 6',292,252,324,276,27],
    ['Office 1',212,292,244,324,20],['Office 2',252,292,276,324,17],['Office 3',292,292,324,324,20],
    ['Shop 1',160,210,186,232,8],['Shop 2',160,240,186,262,8],['Cafe',160,296,186,318,8],
    ['Shop 3',160,330,186,352,8],['Shop 4',160,360,186,382,8],
    ['House 1',460,220,480,238,5],['House 2',495,220,515,238,5],['House 3',530,220,550,238,5],
    ['House 4',460,300,480,318,5],['House 5',530,300,550,318,5],
    ['House 6',460,380,480,398,5],['House 7',495,380,515,398,5],['House 8',530,380,550,398,5],
    ['Apartments 1',380,210,410,250,14],['Apartments 2',380,290,410,330,14],['Fuel Stop',520,100,556,130,5],
    ['Starter Bungalow',494,300,516,318,5],
  ];
  const LOTS = LOTS_L.map((b) => ({ minX: lw(b[1]), maxX: lw(b[3]), minZ: lz(b[2]), maxZ: lz(b[4]) }));
  function baseH(x, z) { // gentle hills; max gradient ~7-8% anywhere (verified in test)
    const h = 3.0 * Math.sin(x * 0.009 + 1.7) * Math.cos(z * 0.008)
            + 1.8 * Math.cos(x * 0.014 - 0.6) * Math.sin(z * 0.011 + 0.9)
            + 8 * smooth((x - 140) / 240)   // Palm Court hillside, east
            + 4 * smooth((-z - 160) / 160); // rise toward Bayshore Highway, north
    return h * smooth((x - (BEACH_X - 30)) / 30); // flat sand at the waterline
  }
  for (const L of LOTS) L.padY = baseH((L.minX + L.maxX) / 2, (L.minZ + L.maxZ) / 2);
  function terrainH(x, z) { // building pads flatten inside each lot (blended inward): roads keep natural slope
    let h = baseH(x, z);
    for (const L of LOTS) {
      const d = Math.min(x - L.minX, L.maxX - x, z - L.minZ, L.maxZ - z);
      if (d <= 0) continue;
      const w = smooth(d / 6); // pad blend inward only: roads always keep the natural slope
      h = h * (1 - w) + L.padY * w;
    }
    return h;
  }

  // ocean: flat plane west of the beach
  const ocean = new THREE.Mesh(new THREE.PlaneGeometry(300, 680), matWater);
  ocean.rotation.x = -Math.PI / 2; ocean.position.set(-368, -0.25, 0); scene.add(ocean);

  // ground: one subdivided terrain-following mesh, vertex colors (sand / grass / park), one draw call
  {
    const X0 = -218, X1 = 320, Z0 = -320, Z1 = 320, NX = 60, NZ = 72; // ~8.6k tris (was 15.4k)
    const pos = [], col = [], idx = [];
    const cSand = new THREE.Color(0xe3d3a0), cGrass = new THREE.Color(0x6f9b52), cPark = new THREE.Color(0x7cb85e);
    for (let j = 0; j <= NZ; j++) for (let i = 0; i <= NX; i++) {
      const x = X0 + (X1 - X0) * i / NX, z = Z0 + (Z1 - Z0) * j / NZ;
      pos.push(x, terrainH(x, z), z);
      const c = x < BEACH_X ? cSand
        : (x >= lw(210) && x <= lw(350) && z >= lz(368) && z <= lz(432) ? cPark : cGrass);
      col.push(c.r, c.g, c.b);
    }
    for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
      const a = j * (NX + 1) + i, b = a + 1, c2 = a + NX + 1, d2 = c2 + 1;
      idx.push(a, c2, b, b, c2, d2);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx); g.computeVertexNormals();
    scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })));
  }

  // Pelican Pier: walkable deck out over the water
  const pier = new THREE.Mesh(new THREE.BoxGeometry(102, 0.4, 16), matPier);
  pier.position.set(lw(71), 0.2, lz(300)); scene.add(pier);
  for (let px = 24; px <= 116; px += 23) { // pier posts
    for (const pz of [293, 307]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 2.2, 8), matPier);
      post.position.set(lw(px), -0.7, lz(pz)); scene.add(post);
    }
  }

  // ---- roads ----
  const ROADS = [
    { kind: 'v', at: 130, from: 80,  to: 520, w: 8  },  // Boardwalk
    { kind: 'v', at: 200, from: 80,  to: 480, w: 8  },
    { kind: 'v', at: 280, from: 80,  to: 480, w: 8  },
    { kind: 'v', at: 360, from: 80,  to: 480, w: 8  },
    { kind: 'v', at: 440, from: 80,  to: 480, w: 8  },
    { kind: 'v', at: 500, from: 80,  to: 200, w: 10 },  // highway ramp
    { kind: 'h', at: 200, from: 130, to: 560, w: 8  },
    { kind: 'h', at: 280, from: 130, to: 560, w: 8  },
    { kind: 'h', at: 360, from: 130, to: 560, w: 8  },
    { kind: 'h', at: 440, from: 130, to: 560, w: 8  },
  ];
  const HWY = { kind: 'h', at: 80, from: 126, to: 600, w: 14 }; // Bayshore Highway

  // roads + highway drape the terrain: segmented strips sampling terrainH, so every
  // street and the highway follows the hills (grades verified <=9%, drivable at 19 m/s)
  const strips = [];
  function strip(r, mat, halfW, off, step, len) {
    const qs = [];
    for (let d0 = r.from + (len ? 6 : 0); d0 < r.to - (len ? len + 4 : 0); d0 += step) {
      const d1 = len ? Math.min(d0 + len, r.to) : Math.min(d0 + step, r.to);
      let p;
      if (r.kind === 'v') p = [lw(r.at) - halfW, lz(d0), lw(r.at) + halfW, lz(d0), lw(r.at) + halfW, lz(d1), lw(r.at) - halfW, lz(d1)];
      else p = [lw(d0), lz(r.at) - halfW, lw(d1), lz(r.at) - halfW, lw(d1), lz(r.at) + halfW, lw(d0), lz(r.at) + halfW];
      qs.push([p[0], terrainH(p[0], p[1]) + off, p[1], p[2], terrainH(p[2], p[3]) + off, p[3],
               p[4], terrainH(p[4], p[5]) + off, p[5], p[6], terrainH(p[6], p[7]) + off, p[7]]);
    }
    strips.push({ mat, qs });
  }
  for (const r of ROADS) strip(r, matRoad, r.w / 2, 0.04, 8, 0);
  strip(HWY, matHwy, HWY.w / 2, 0.05, 8, 0);
  const DRIVES = [{ kind: 'v', at: 497, from: 284, to: 304, w: 6 }]; // bungalow driveway (drivable, no dashes)
  for (const d of DRIVES) strip(d, matDrive, d.w / 2, 0.045, 4, 0);
  for (const r of ROADS) strip(r, matLine, 0.2, 0.08, 12, 3);
  strip(HWY, matHwyLn, 0.2, 0.09, 16, 4);
  { // merge strip segments into one mesh per material
    const byMat = new Map();
    for (const s of strips) {
      if (!byMat.has(s.mat)) byMat.set(s.mat, []);
      byMat.get(s.mat).push(...s.qs);
    }
    for (const [mat, qs] of byMat) {
      const pos = [], norm = [], idx = [];
      qs.forEach((q, i) => {
        const b = i * 4;
        pos.push(...q);
        const ux = q[3] - q[0], uy = q[4] - q[1], uz = q[5] - q[2];
        const vx = q[6] - q[0], vy = q[7] - q[1], vz = q[8] - q[2];
        let nx = vy * uz - vz * uy, ny = vz * ux - vx * uz, nz = vx * uy - vy * ux;
        const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
        for (let k = 0; k < 4; k++) norm.push(nx, ny, nz);
        idx.push(b, b + 2, b + 1, b, b + 3, b + 2);
      });
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
      g.setIndex(idx);
      scene.add(new THREE.Mesh(g, mat));
    }
  }

  // ---- facade textures: drawn once on canvas, window grid + entrance (original art) ----
  function facadeTex(w, h, kind) {
    const pxm = 8, cw = Math.min(256, Math.max(64, Math.round(w * pxm)));
    const ch = Math.min(512, Math.max(64, Math.round(h * pxm)));
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const g = cv.getContext('2d');
    const wall = { tower: '#66788f', office: '#8395a9', apartment: '#a4b0bd',
                   shop: '#cfa871', house: '#de9873', gas: '#d46a6a', far: '#a9b8c7' }[kind] || '#999999';
    g.fillStyle = wall; g.fillRect(0, 0, cw, ch);
    const floors = Math.max(1, Math.round(h / 3));
    const cols = Math.max(1, Math.floor(w / 3.4));
    const wy = ch / floors, wx = cw / cols;
    for (let f = 0; f < floors; f++) {
      for (let c = 0; c < cols; c++) {
        const x0 = c * wx + wx * 0.22, y0 = f * wy + wy * 0.2, ww = wx * 0.56, wh = wy * 0.52;
        g.fillStyle = kind === 'far' ? 'rgba(74,94,116,0.55)' : 'rgba(20,34,52,0.9)'; // window glass
        g.beginPath(); g.roundRect(x0, y0, ww, wh, 2); g.fill();
        g.fillStyle = 'rgba(160,210,235,0.55)';                   // sky glint
        g.beginPath(); g.roundRect(x0, y0, ww, wh * 0.35, 2); g.fill();
      }
    }
    // ground floor: entrance door + lintel
    const dw = Math.min(cw * 0.22, 26), dx = (cw - dw) / 2, dh = Math.min(wy * 0.9, 30);
    g.fillStyle = '#2c343c'; g.fillRect(dx - 2, ch - dh - 2, dw + 4, dh + 2);
    g.fillStyle = '#4a3828'; g.fillRect(dx, ch - dh, dw, dh);
    g.fillStyle = 'rgba(160,210,235,0.5)'; g.fillRect(dx + 2, ch - dh + 2, dw - 4, dh * 0.4);
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  const roofMat = new THREE.MeshLambertMaterial({ color: 0x4a5058 });
  const trimMat = new THREE.MeshLambertMaterial({ color: 0xd8d4c8 });
  const doorMat = new THREE.MeshLambertMaterial({ color: 0x3a2e22 });
  const awnMat  = new THREE.MeshLambertMaterial({ color: 0xc94f4f });
  const domeMat = new THREE.MeshLambertMaterial({ color: 0x7fb7c9 });
  const pentMat = new THREE.MeshLambertMaterial({ color: 0x8d9db0 });

  // face: which side the entrance is on ('n' = -z north street, 'w' = -x boardwalk)
  function building(name, x0, y0, x1, y1, floors, kind, face, roof) {
    const w = x1 - x0, d = y1 - y0, h = floors * 3;
    const cx = lw((x0 + x1) / 2), cz = lz((y0 + y1) / 2);
    const gy = terrainH(cx, cz) - 0.6; // lot pad height, sunk 0.6 as a foundation
    const g = new THREE.Group(); g.name = 'bld:' + name;
    const side = new THREE.MeshLambertMaterial({ map: facadeTex(Math.max(w, d), h, kind) });
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, roofMat, roofMat, side, side]);
    m.position.set(cx, gy + h / 2, cz); g.add(m);
    // roof trim slab (cornice)
    const trim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.8, 0.6, d + 0.8), trimMat);
    trim.position.set(cx, gy + h + 0.3, cz); g.add(trim);
    // entrance door (proud of the facade)
    const dw2 = Math.min(2.2, w * 0.25);
    const door = new THREE.Mesh(new THREE.BoxGeometry(face === 'w' ? 0.35 : dw2, 2.4, face === 'w' ? dw2 : 0.35), doorMat);
    door.position.set(face === 'w' ? lw(x0) - 0.15 : cx, gy + 1.2, face === 'w' ? cz : lz(y0) - 0.15);
    g.add(door);
    // roof structure (rounded, low-poly)
    if (roof === 'dome') {
      const dome = new THREE.Mesh(new THREE.SphereGeometry(Math.min(w, d) * 0.38, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), domeMat);
      dome.position.set(cx, gy + h + 0.6, cz); g.add(dome);
    } else if (roof === 'pent') {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(Math.min(w, d) * 0.26, Math.min(w, d) * 0.3, 3, 10), pentMat);
      p.position.set(cx, gy + h + 2.1, cz); g.add(p);
    } else if (roof === 'hip') { // house hip roof: 4-sided cone, rounded silhouette
      const r = new THREE.Mesh(new THREE.ConeGeometry(Math.hypot(w, d) / 2 * 0.92, 2.6, 4, 1), awnMat);
      r.rotation.y = Math.PI / 4 + Math.atan2(d, w) - Math.PI / 4;
      r.scale.set(1, 1, d / w);
      r.position.set(cx, gy + h + 1.3, cz); g.add(r);
    } else if (roof === 'awning') { // shop awning angled over the entrance
      const a = new THREE.Mesh(new THREE.BoxGeometry(face === 'w' ? 2.4 : w * 0.7, 0.18, face === 'w' ? d * 0.7 : 2.4), awnMat);
      a.position.set(face === 'w' ? lw(x0) - 1.2 : cx, gy + 2.9, face === 'w' ? cz : lz(y0) - 1.2);
      a.rotation[face === 'w' ? 'z' : 'x'] = face === 'w' ? 0.35 : -0.35;
      g.add(a);
    }
        S.add(g);
  blocks.push({ minX: lw(x0), maxX: lw(x1), minZ: lz(y0), maxZ: lz(y1) });
  }

  const blocks = [];
  // Downtown Solana (n = entrance on the north street side)
  building('Tower 1', 212, 212, 244, 244, 12, 'tower', 'n', 'pent');
  building('Tower 2', 252, 212, 276, 240, 9,  'tower', 'n', null);
  building('Tower 3', 212, 252, 240, 276, 14, 'tower', 'n', 'dome');
  building('Tower 4', 252, 252, 276, 276, 7,  'tower', 'n', null);
  building('Tower 5', 292, 212, 324, 244, 10, 'tower', 'n', 'pent');
  building('Tower 6', 292, 252, 324, 276, 8,  'tower', 'n', null);
  building('Office 1', 212, 292, 244, 324, 6, 'office', 'n', null);
  building('Office 2', 252, 292, 276, 324, 5, 'office', 'n', null);
  building('Office 3', 292, 292, 324, 324, 6, 'office', 'n', null);
  // Boardwalk shops (entrances face west to the boardwalk), red awnings
  building('Shop 1', 160, 210, 186, 232, 2, 'shop', 'w', 'awning');
  building('Shop 2', 160, 240, 186, 262, 2, 'shop', 'w', 'awning');
  building('Cafe',   160, 296, 186, 318, 2, 'shop', 'w', 'awning'); // nudged south of H280 (v4)
  building('Shop 3', 160, 330, 186, 352, 2, 'shop', 'w', 'awning');
  building('Shop 4', 160, 360, 186, 382, 2, 'shop', 'w', 'awning');
  // Palm Court houses (hip roofs)
  building('House 1', 460, 220, 480, 238, 1, 'house', 'n', 'hip');
  building('House 2', 495, 220, 515, 238, 1, 'house', 'n', 'hip');
  building('House 3', 530, 220, 550, 238, 1, 'house', 'n', 'hip');
  building('House 4', 460, 300, 480, 318, 1, 'house', 'n', 'hip');
  building('House 5', 530, 300, 550, 318, 1, 'house', 'n', 'hip');
  building('House 6', 460, 380, 480, 398, 1, 'house', 'n', 'hip');
  building('House 7', 495, 380, 515, 398, 1, 'house', 'n', 'hip');
  building('House 8', 530, 380, 550, 398, 1, 'house', 'n', 'hip');
  // Apartments
  building('Apartments 1', 380, 210, 410, 250, 4, 'apartment', 'n', null);
  building('Apartments 2', 380, 290, 410, 330, 4, 'apartment', 'n', null);
  // Fuel Stop: kiosk + rounded canopy on two posts
  building('Fuel Stop', 520, 100, 556, 130, 1, 'gas', 'n', null);
  {
    const cx = lw(538), cz = lz(97);
    const gy = terrainH(cx, cz);
    const can = new THREE.Mesh(new THREE.CylinderGeometry(14, 14, 0.5, 16), trimMat);
    can.position.set(cx, gy + 5.2, cz); scene.add(can);
    for (const dx of [-9, 9]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 5, 8), pentMat);
      post.position.set(cx + dx, gy + 2.5, cz); scene.add(post);
    }
  }


  // ---- Starter Bungalow (v6): procedural original - walls, hip roof, garage, driveway ----
  {
    const HX0 = lw(500), HX1 = lw(512), HZ0 = lz(304), HZ1 = lz(312); // house 12x8
    const GX0 = lw(494), GX1 = lw(500), GZ0 = lz(304), GZ1 = lz(310); // garage 6x6
    const gcx = (HX0 + HX1) / 2, gcz = (HZ0 + HZ1) / 2;
    const gy = terrainH(gcx, gcz);
    const bg = new THREE.Group(); bg.name = 'bld:Starter Bungalow';
    const stucco = new THREE.MeshLambertMaterial({ color: 0xe8dcc8 });
    const roofB  = new THREE.MeshLambertMaterial({ color: 0x7a5c48 });
    const glass  = new THREE.MeshLambertMaterial({ color: 0x2a3d52 });
    const doorW  = new THREE.MeshLambertMaterial({ color: 0x6b4a2e });
    // house walls + hip roof
    const hw = new THREE.Mesh(new THREE.BoxGeometry(HX1 - HX0, 3, HZ1 - HZ0), stucco);
    hw.position.set(gcx, gy + 1.5, gcz); bg.add(hw);

    for (const wx of [HX0 + 5.5, HX0 + 9]) {

      win.position.set(wx, gy + 1.7, HZ0 - 0.07); bg.add(win);
      const wf = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.5, 0.06), stucco);
      wf.position.set(wx, gy + 1.7, HZ0 - 0.04); bg.add(wf);

    // porch slab
    const porch = new THREE.Mesh(new THREE.BoxGeometry(4, 0.18, 2.4), matDrive);
    porch.position.set(HX0 + 2.2, gy + 0.09, HZ0 - 1.3); bg.add(porch);
    scene.add(bg);
    blocks.push({ minX: HX0, maxX: HX1, minZ: HZ0, maxZ: HZ1 });
    blocks.push({ minX: GX0, maxX: GX1, minZ: GZ0, maxZ: GZ1 });
  }

  // ---- Kenney CC0 model swap (owner 10:25 PM: real 3D models; coordinator: GLTFLoader in importmap) ----
  // Every building keeps its primitive fallback in group S until its GLB lands, then swaps.
  // Assets: assets/models/{commercial,suburban,roads}/*.glb (+ Textures/colormap.png), all Kenney CC0 1.0.
  const MODEL_BASE = 'assets/models/';
  // key = building() name; f = glb under MODEL_BASE; rot = rotY; lod = low-detail partner
  const MODELS = [
    { k: 'Tower 1', f: 'commercial/building-skyscraper-a', rot: Math.PI, lod: 'primitive' },
    { k: 'Tower 2', f: 'commercial/building-skyscraper-b', rot: Math.PI, lod: 'primitive' },
    { k: 'Tower 3', f: 'commercial/building-skyscraper-c', rot: Math.PI, lod: 'primitive' },
    { k: 'Tower 4', f: 'commercial/building-skyscraper-d', rot: Math.PI, lod: 'primitive' },
    { k: 'Tower 5', f: 'commercial/building-skyscraper-e', rot: Math.PI, lod: 'primitive' },
    { k: 'Tower 6', f: 'commercial/building-skyscraper-a', rot: 0, lod: 'primitive' },
    { k: 'Office 1', f: 'commercial/building-a', rot: Math.PI, lod: 'commercial/low-detail-building-a' },
    { k: 'Office 2', f: 'commercial/building-b', rot: Math.PI, lod: 'commercial/low-detail-building-b' },
    { k: 'Office 3', f: 'commercial/building-c', rot: Math.PI, lod: 'commercial/low-detail-building-c' },
    { k: 'Shop 1', f: 'commercial/building-d', rot: -Math.PI / 2, lod: 'commercial/low-detail-building-d' },
    { k: 'Shop 2', f: 'commercial/building-e', rot: -Math.PI / 2, lod: 'commercial/low-detail-building-e' },
    { k: 'Cafe',    f: 'commercial/building-f', rot: -Math.PI / 2, lod: 'commercial/low-detail-building-f' },
    { k: 'Shop 3', f: 'commercial/building-g', rot: -Math.PI / 2, lod: 'commercial/low-detail-building-g' },
    { k: 'Shop 4', f: 'commercial/building-h', rot: -Math.PI / 2, lod: 'commercial/low-detail-building-h' },
    { k: 'House 1', f: 'suburban/building-type-a', rot: Math.PI },
    { k: 'House 2', f: 'suburban/building-type-b', rot: Math.PI },
    { k: 'House 3', f: 'suburban/building-type-c', rot: Math.PI },
    { k: 'House 4', f: 'suburban/building-type-d', rot: Math.PI },
    { k: 'House 5', f: 'suburban/building-type-e', rot: Math.PI },
    { k: 'House 6', f: 'suburban/building-type-f', rot: Math.PI },
    { k: 'House 7', f: 'suburban/building-type-b', rot: Math.PI },
    { k: 'House 8', f: 'suburban/building-type-c', rot: Math.PI },
    { k: 'Apartments 1', f: 'commercial/building-j', rot: Math.PI, lod: 'commercial/low-detail-building-j' },
    { k: 'Apartments 2', f: 'commercial/building-k', rot: Math.PI, lod: 'commercial/low-detail-building-k' },
    { k: 'Fuel Stop', f: 'commercial/building-i', rot: Math.PI, lod: 'commercial/low-detail-building-i' },
  ];
  const FOOT = {}; // name -> layout footprint (pad list lives up top with the terrain)
  for (const b of LOTS_L) FOOT[b[0]] = { x0: b[1], y0: b[2], x1: b[3], y1: b[4], h: b[5] };

  function lodify(obj) { // glTF PBR -> cheap Lambert, static shadows off (M02s budget)
    obj.traverse((o) => {
      if (o.isMesh) {
        if (o.geometry && !o.geometry.attributes.normal) o.geometry.computeVertexNormals(); // props ship no normals: some three versions light them black
        const col = o.geometry && o.geometry.attributes.color;
        if (col && col.itemSize === 4) { // VEC4 COLOR_0 -> vec3 (version-safe vertex colors)
          const n = col.count, a = new Float32Array(n * 3);
          for (let i = 0; i < n; i++) { a[i*3] = col.getX(i); a[i*3+1] = col.getY(i); a[i*3+2] = col.getZ(i); }
          o.geometry.setAttribute('color', new THREE.BufferAttribute(a, 3));
        }
        const m = o.material;
        o.material = new THREE.MeshLambertMaterial({
          map: m.map || null,
          color: (m.color && m.color.clone) ? m.color.clone() : new THREE.Color(0xffffff),
          transparent: m.transparent === true, opacity: m.opacity, side: m.side,
          vertexColors: m.vertexColors === true, // Mohamed's props carry vertex colors, no textures
        });
        o.castShadow = false; o.receiveShadow = false;
      }
    });
    return obj;
  }
  function fitFootprint(obj, ft, rot) { // rotate, scale uniformly into the footprint, sit on ground
    obj.rotation.y = rot;
    let box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const sx = (ft.x1 - ft.x0) / size.x, sz = (ft.y1 - ft.y0) / size.z;
    const sy = Math.min((sx + sz) / 2, (ft.h || 60) / size.y); // fill the lot, cap height
    obj.scale.set(sx, sy, sz);
    box.setFromObject(obj);
    const c = box.getCenter(new THREE.Vector3());
    const gx = lw((ft.x0 + ft.x1) / 2), gz = lz((ft.y0 + ft.y1) / 2);
    obj.position.set(gx - c.x, terrainH(gx, gz) - 0.6 - box.min.y, gz - c.z); // on its pad, sunk 0.6 foundation
    return obj;
  }
  function fitHeight(obj, x, z, rot, h) { // props: scale to a target height, sit at (x,z)
    obj.rotation.y = rot;
    let box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    obj.scale.setScalar(h / size.y);
    box.setFromObject(obj);
    const c = box.getCenter(new THREE.Vector3());
    obj.position.set(x - c.x, terrainH(x, z) - 0.15 - box.min.y, z - c.z); // prop sits on the terrain
    return obj;
  }

  function swapToModels(GL) {
    const loader = new GL();
    for (const m of MODELS) {
      const ft = FOOT[m.k];
      loader.load(MODEL_BASE + m.f + '.glb', (g) => {
        const obj = fitFootprint(lodify(g.scene), ft, m.rot);
        const old = S.getObjectByName('bld:' + m.k);
        if (m.lod === 'primitive' && old) { // towers: detailed GLB near, lightened primitive far
          S.remove(old);
          const farSide = new THREE.MeshLambertMaterial({
            map: facadeTex(Math.max(ft.x1 - ft.x0, ft.y1 - ft.y0), ft.h || 30, 'far') });
          old.traverse((o) => { // swap the dark near facade for the light far one
            if (o.isMesh && Array.isArray(o.material)) o.material = [farSide, farSide, o.material[2], o.material[3], farSide, farSide];
          });
          const lod = new THREE.LOD();
          lod.addLevel(obj, 0); lod.addLevel(old, 70); // towers: far level past 70 m
          scene.add(lod);
        } else if (m.lod) {
          if (old) S.remove(old);
          loader.load(MODEL_BASE + m.lod + '.glb', (g2) => {
            const low = fitFootprint(lodify(g2.scene), ft, m.rot);
            const lod = new THREE.LOD();
            lod.addLevel(obj, 0); lod.addLevel(low, 55); // shops/offices: low detail past 55 m
            scene.add(lod);
          }, undefined, () => scene.add(obj));
        } else {
          if (old) S.remove(old);
          scene.add(obj);
        }
      }, undefined, () => {}); // load failed: primitive fallback stays
    }
    // street props (no fallback; small and cheap)
    const PROPS = [];
    for (const x of [-100, -20, 60, 140]) for (const z of [-100, -20, 60, 140])
      PROPS.push(['roads/light-curved', x + 5.5, z + 5.5, Math.PI, 6]);
    PROPS.push(
      ['roads/traffic-light', -14, -26, 0, 4.2], ['roads/traffic-light', 66, 54, Math.PI / 2, 4.2],
      ['roads/road-sign-stop', -94, -26, Math.PI, 2.6], ['roads/road-sign-stop', 66, 146, Math.PI / 2, 2.6],
      ['roads/sign-highway', 100, -208, Math.PI, 4],
      ['roads/dumpster', -137, -30, Math.PI / 2, 1.6], ['roads/dumpster', -137, 50, Math.PI / 2, 1.6],
      ['suburban/planter', -160, -40, 0, 0.9], ['suburban/planter', -160, -10, 0, 0.9],
      ['suburban/planter', -160, 20, 0, 0.9], ['suburban/planter', -160, 50, 0, 0.9],
      // Seaside Park trees + Palm Court greenery (no palm model in the kits - gap noted)
      ['suburban/tree-large', -70, 80, 0, 6], ['suburban/tree-small', -40, 75, 1, 4],
      ['suburban/tree-large', -10, 85, 2, 6.5], ['suburban/tree-small', 20, 78, 0, 4],
      ['suburban/tree-large', 35, 100, 1, 6], ['suburban/tree-small', -55, 110, 2, 4.5],
      ['suburban/tree-large', -20, 120, 0, 6], ['suburban/tree-small', 10, 115, 1, 4],
      ['suburban/tree-small', 160, -55, 0, 4.5], ['suburban/tree-large', 215, -55, 1, 6],
      ['suburban/tree-small', 160, 100, 2, 4.5], ['suburban/tree-large', 215, 100, 0, 6],
    );
    for (const [f, x, z, rot, h] of PROPS) {
      loader.load(MODEL_BASE + f + '.glb', (g) => {
        scene.add(fitHeight(lodify(g.scene), x, z, rot, h));
      }, undefined, () => {});
    }
    // Mohamed's six props (palm, streetlight, bench, bin, hydrant, traffic light) - GLB zip pending;
    // each load silently skips until assets/models/props/<name>.glb exists (v4 pre-wiring)
    const PROPS2 = [
      // palms along the boardwalk west side (fills the no-palm gap in the Kenney kits)
      ['props/palm', -178, -180, 0, 7], ['props/palm', -178, -140, 1.2, 6.5], ['props/palm', -178, -100, 2.1, 7],
      ['props/palm', -178, -60, 0.6, 6], ['props/palm', -178, 20, 1.7, 7], ['props/palm', -178, 60, 2.9, 6.5],
      ['props/palm', -178, 100, 0.4, 7], ['props/palm', -178, 140, 1.1, 6], ['props/palm', -178, 180, 2.4, 7],
      // benches: pier entrance, Seaside Park, Palm Court
      ['props/bench', -150, -12, Math.PI / 2, 1], ['props/bench', -40, 95, 0, 1], ['props/bench', 15, 90, Math.PI, 1],
      ['props/bench', 190, 30, Math.PI / 2, 1],
      // bins by the shops and downtown corners
      ['props/bin', -146, 26, 0, 1], ['props/bin', -146, 66, 0, 1], ['props/bin', -66, -26, 0, 1],
      // hydrants downtown
      ['props/hydrant', -66, 14, 0, 0.8], ['props/hydrant', 14, -26, 0, 0.8],
      // streetlights on the downtown corners not covered by the roads kit
      ['props/streetlight', -24, 54, Math.PI, 5.5], ['props/streetlight', 66, -26, 0, 5.5],
      // traffic light at the H280 x V280 junction (the roads-kit lights cover two other junctions)
      ['props/traffic_light', -24, -104, Math.PI / 2, 4.2],
    ];
    for (const [f, x, z, rot, h] of PROPS2) {
      loader.load(MODEL_BASE + f + '.glb', (g) => {
        scene.add(fitHeight(lodify(g.scene), x, z, rot, h));
      }, undefined, () => {}); // zip not here yet: skip silently
    }
  }
  if (GLTFLoader) swapToModels(GLTFLoader);
  else {
    import('three/addons/loaders/GLTFLoader.js')
      .then((m) => swapToModels(m.GLTFLoader))
      .catch(() => {}); // no loader wired: stay on primitives
  }

  // ---- API ----
  const WATER_X = lw(82);
  const PIER = { minX: lw(20), maxX: lw(122), minZ: lz(292), maxZ: lz(308) };
  const onPier = (x, z) => x >= PIER.minX && x <= PIER.maxX && z >= PIER.minZ && z <= PIER.maxZ;

  function groundAt(x, z) { return onPier(x, z) ? 0.4 : terrainH(x, z); } // real elevation

  function isBlocked(x, z, r) {
    for (const b of blocks) {
      if (x + r > b.minX && x - r < b.maxX && z + r > b.minZ && z - r < b.maxZ) return true;
    }
    if (x - r < WATER_X && !onPier(x, z)) return true;          // water (pier stays walkable)
    if (x < -C || x > C || z < -C || z > C) return true;        // world edge
    return false;
  }

  function roadHit(r, x, z) {
    const h = r.w / 2;
    if (r.kind === 'v') return Math.abs(x - lw(r.at)) <= h && z >= lz(r.from) && z <= lz(r.to);
    return Math.abs(z - lz(r.at)) <= h && x >= lw(r.from) && x <= lw(r.to);
  }
  function isRoadAt(x, z) {
    for (const r of ROADS) if (roadHit(r, x, z)) return true;
    for (const d of DRIVES) if (roadHit(d, x, z)) return true;
    return roadHit(HWY, x, z);
  }

  // Named, road-safe taxi stops (original names), all >>20 m apart, 2.5 m off centerline
  const taxiStops = [
    { x: lw(132.5), z: lz(300), name: 'Pelican Pier' },
    { x: lw(282.5), z: lz(240), name: 'Downtown Solana' },
    { x: lw(442.5), z: lz(320), name: 'Palm Court' },
    { x: lw(240),   z: lz(442.5), name: 'Seaside Park' },
    { x: lw(480),   z: lz(84.5),  name: 'Bayshore Fuel' },
  ];

  return {
    bounds: { minX: -C, maxX: C, minZ: -C, maxZ: C },
    spawnPoints: {
      player: { x: lw(145), z: lz(320), heading: Math.PI / 2 }, // boardwalk, facing the shops (east)
      car:    { x: lw(497), z: lz(294), heading: 0 },           // v6: starter car on the bungalow driveway, facing the street
    },
    groundAt, heightAt: groundAt,
    isBlocked, blockedAt: isBlocked,
    isRoadAt, taxiStops,
    starterHome: { x: lw(505), z: lz(309), name: 'Palm Court Bungalow' },
    update(dt) {},
  };
}

function createControls({container=document.body,onInteract=()=>{}}={}) {
 const state={steer:0,throttle:0,moveX:0,moveY:0,brake:false};
 const held=new Set(), pointers=new Map();let joy=null,stick=null;
 const root=document.createElement('div');root.className='city-controls';root.innerHTML=`<style>.city-controls{position:fixed;inset:0;pointer-events:none;z-index:50;touch-action:none;user-select:none;-webkit-user-select:none}.city-controls button{position:absolute;pointer-events:auto;border:1px solid #ffffff65;background:#132536bb;color:#fff;border-radius:18px;font:bold 15px system-ui;min-width:64px;min-height:58px;touch-action:none}.city-controls .city-stick{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:24px;width:122px;height:122px;border-radius:50%;border:2px solid #ffffff65;background:#13253677;pointer-events:auto;touch-action:none}.city-controls .city-knob{position:absolute;left:38px;top:38px;width:46px;height:46px;border-radius:50%;background:#e8f1e5cc;pointer-events:none}.city-controls .city-action{right:max(26px,env(safe-area-inset-right));bottom:104px;padding:0 18px}.city-controls .city-brake{right:max(26px,env(safe-area-inset-right));bottom:28px;padding:0 18px}.city-controls .city-help{position:absolute;bottom:8px;left:170px;right:130px;text-align:center;color:#fff9;font:11px system-ui;pointer-events:none}@media(max-height:330px){.city-controls .city-stick{bottom:16px;transform:scale(.8);transform-origin:bottom left}.city-controls .city-action{bottom:86px}.city-controls .city-brake{bottom:18px}}</style><div class="city-stick" role="application" aria-label="Move or steer"><div class="city-knob"></div></div><button class="city-action" aria-label="Enter or exit car">ENTER CAR</button><button class="city-brake" aria-label="Brake">BRAKE</button><div class="city-help">Left stick: move / steer · E: enter / exit · Space: brake</div>`;
 container.append(root);stick=root.querySelector('.city-stick');const knob=root.querySelector('.city-knob'),action=root.querySelector('.city-action'),brake=root.querySelector('.city-brake');let sx=0,sy=0;
 function refresh(){const x=Math.max(-1,Math.min(1,sx+(held.has('KeyD')||held.has('ArrowRight')?1:0)-(held.has('KeyA')||held.has('ArrowLeft')?1:0))),y=Math.max(-1,Math.min(1,-sy+(held.has('KeyW')||held.has('ArrowUp')?1:0)-(held.has('KeyS')||held.has('ArrowDown')?1:0)));state.moveX=x;state.moveY=y;state.steer=x;state.throttle=y;state.brake=held.has('Space')||pointers.size>0;}
 function drag(e){const r=stick.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width*.34),dy=(e.clientY-r.top-r.height/2)/(r.height*.34),n=Math.max(1,Math.hypot(dx,dy));sx=dx/n;sy=dy/n;if(Math.hypot(sx,sy)<.1)sx=sy=0;knob.style.transform=`translate(${sx*38}px,${sy*38}px)`;refresh();}
 stick.addEventListener('pointerdown',e=>{if(joy!==null)return;joy=e.pointerId;stick.setPointerCapture(joy);drag(e);e.preventDefault();});stick.addEventListener('pointermove',e=>{if(e.pointerId===joy)drag(e);});function release(e){if(e.pointerId!==joy)return;joy=null;sx=sy=0;knob.style.transform='';refresh();}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);stick.addEventListener('lostpointercapture',release);
 brake.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,true);brake.setPointerCapture(e.pointerId);refresh();});for(const ev of ['pointerup','pointercancel','lostpointercapture'])brake.addEventListener(ev,e=>{pointers.delete(e.pointerId);refresh();});action.addEventListener('click',onInteract);
 const relevant=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyE']);function keydown(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(relevant.has(e.code))e.preventDefault();if(e.code==='KeyE'&&!e.repeat)onInteract();held.add(e.code);refresh();}function keyup(e){held.delete(e.code);refresh();}function reset(){held.clear();pointers.clear();joy=null;sx=sy=0;knob.style.transform='';refresh();}addEventListener('keydown',keydown);addEventListener('keyup',keyup);addEventListener('blur',reset);document.addEventListener('visibilitychange',reset);
 return{state,root,setMode(driving){action.textContent=driving?'EXIT CAR':'ENTER CAR';},setActionLabel(text){action.textContent=text;},reset,destroy(){removeEventListener('keydown',keydown);removeEventListener('keyup',keyup);removeEventListener('blur',reset);document.removeEventListener('visibilitychange',reset);root.remove();}};
}

// v009: adds original white sport sedan (starter car, ~4.6 m) and green cruiser bike (~2.2 m,
// lean-in riding). sedan parks at map.spawnPoints.car (map v6 driveway); taxi keeps actors.car.
function createActors({THREE:T,scene,map={},spawn={x:0,z:8},notify=()=>{},onModeChange=()=>{}}){
 const ground=(x,z)=>{const y=(map.groundAt||map.heightAt||(()=>0))(x,z);return Number.isFinite(y)?y:0;};
 const blocked=(x,z,r)=>!!((map.isBlocked||map.blockedAt||(()=>false))(x,z,r));
 const material=c=>new T.MeshLambertMaterial({color:c});const mats={skin:material('#c68b59'),shirt:material('#ecebdf'),pants:material('#26344c'),shoe:material('#152335'),body:material('#e6b32e'),dark:material('#243247'),glass:material('#71b7cb'),rubber:material('#202733'),lamp:material('#fff0b2'),rim:material('#b8c7c9'),tail:material('#ce594e'),white:material('#f2f1ea'),glass2:material('#2b3a47'),red:material('#c0392b'),green:material('#2e7d4f'),chrome:material('#c3cdcf'),black:material('#1c242e')};
 const geometries=[];
 function mesh(parent,geo,mat,x=0,y=0,z=0){geometries.push(geo);const o=new T.Mesh(geo,mat);o.position.set(x,y,z);parent.add(o);return o;}

function createTaxiJob({routes, getVehicle, onChange=()=>{}, initialState=null}) {
  if (!Array.isArray(routes) || routes.length < 1) throw new Error('Taxi routes required');
  const point = p => p && Number.isFinite(p.x) && Number.isFinite(p.z);
  const validRoutes = routes.filter(r => r && typeof r.id==='string' && point(r.pickup) && point(r.dropoff) && Math.hypot(r.pickup.x-r.dropoff.x,r.pickup.z-r.dropoff.z)>=20);
  if (validRoutes.length!==routes.length) throw new Error('Taxi routes need distinct, finite road-safe stops');
  const money = n => Number.isSafeInteger(n) && n>=0 && n<=100000000;
  const state = {version:1,balance:0,completed:0,routeIndex:0,phase:'idle',dwell:0,message:'Open Phone to find taxi work.',lastFare:0};
  if (initialState && initialState.version===1) {

function createDeliveryJob({depot, drops, getCourier, onChange=()=>{}, onPayout=()=>{}, initialState=null}) {

    state.dwell+=step;changed=true;
    if(state.dwell<1.5)return;
    state.dwell=0;

    } else {
      const paid=payout();onPayout(paid);state.earned=Math.min(100000000,state.earned+paid);state.completed=Math.min(100000000,state.completed+1);state.lastPayout=paid;state.phase='idle';state.dropIndex=(state.dropIndex+1)%drops.length;state.message='Parcel delivered. Earned '+paid+' credits.';

// ===== save.js =====
// save.js — save/load/autosave. Coordinator-owned. Contract v1.1.
// Schema v1: { version:1, savedAt, actors: actors.snapshot(), jobs: taxiJob.serialize() }
// actors.snapshot() = { version:1, player:{x,z,yaw}, car:{x,z,yaw}, driving }
// jobs serialize()  = { version:1, balance, completed, routeIndex }
// Reload intentionally cancels any active fare (builder 5's rule, avoids fake passengers).
const KEY = 'coastalcity_save_v1';

function createSave({ getActors, getJobs }) {
  let lastLoaded = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.version !== 1) return null;
      lastLoaded = data;
      return data;
    } catch (e) { return null; }
  }

  function collect() {
    const actors = getActors();
    const jobs = getJobs();
    return {
      version: 1,
      savedAt: Date.now(),
      actors: actors.snapshot(),
      jobs: jobs ? jobs.serialize() : null,
    };
  }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(collect())); }
    catch (e) { /* storage full/blocked: game keeps running */ }
  }

  function restore() {
    if (!lastLoaded) return;
    try {
      if (lastLoaded.actors) getActors().restore(lastLoaded.actors);
      // jobs state is restored through createTaxiJob initialState in main.js
    } catch (e) { /* a bad save never blocks a fresh game */ }
  }

  let timer = 0;
  function startAutosave() {
    stopAutosave();
    timer = setInterval(persist, 1000); // 1 s autosave, standing rule
  }
  function stopAutosave() { if (timer) clearInterval(timer); timer = 0; }

  return { load, collect, persist, restore, startAutosave, stopAutosave };
}

// map v3 Kenney assets ride as ONE pack of .b64 chunks (GitHub's web UI rejects binary
// uploads, and 46 separate chunk-sets would mean 50 editor commits; the pack is 20).
async function loadAssetPack(prefix) {
  const parts = [];
  for (let i = 0; ; i++) {
    const part = await fetch(prefix + '.' + String(i).padStart(2, '0'));
    if (!part.ok) break;
    parts.push(await part.text());
  }
  if (!parts.length) return {};
  const bin = atob(parts.join('').replace(/\s+/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const mlen = new DataView(bytes.buffer).getUint32(0, true);
  const manifest = JSON.parse(new TextDecoder().decode(bytes.subarray(4, 4 + mlen)));
  const start = 4 + mlen, blobs = {};
  for (const [path, [off, len]] of Object.entries(manifest)) {
    blobs[path] = URL.createObjectURL(new Blob([bytes.subarray(start + off, start + off + len)],
      { type: path.endsWith('.png') ? 'image/png' : 'model/gltf-binary' }));
  }
  return blobs;
}

  marker.position.set(target.x, 0.15, target.z);
}

taxiJob = createTaxiJob({
  routes,
  getVehicle: () => ({
    x: actors.car.x, z: actors.car.z,
    speed: actors.car.speed || 0,
    driving: actors.driving === true,
  }),
  onChange: (snap) => { syncMarker(snap); save.persist(); },
  initialState: taxiInit,
});

// parcel delivery: depot at the downtown stop, drops at the other road-safe stops.
// on foot or any vehicle; pays into the shared taxi wallet
const depotStop = stops[1]; // Downtown Solana
const deliveryJobRef = createDeliveryJob({
  depot: { x: depotStop.x, z: depotStop.z, name: 'Solana Depot' },
  drops: stops.filter((s) => s !== depotStop).map((s) => ({ x: s.x, z: s.z, name: s.name })),
  getCourier: () => actors.driving
    ? { x: actors.current.x, z: actors.current.z, speed: actors.current.speed || 0 }
    : { x: actors.player.x, z: actors.player.z, speed: 0 },
  onChange: (snap) => { syncDeliveryMarker(snap); save.persist(); },
  onPayout: (n) => { taxiJob.deposit(n); },
  initialState: deliveryInit,
});
deliveryJob = deliveryJobRef;

const phone = mountTaxiPhone({
  host: document.getElementById('phone-root'),
  job: taxiJob,
  delivery: deliveryJob,
  onPause: (p) => { paused = !!p; if (paused) controls.reset(); },
  onSave: () => { save.persist(); notify('Game saved'); },
});

save.restore();          // actors snapshot back in; jobs state went in via initialState
save.startAutosave();    // every 1 s, his standing rule
syncMarker(taxiJob.snapshot());
syncDeliveryMarker(deliveryJob.snapshot());
phone.render();

// ---- camera follow ----------------------------------------------------------
const camPos = new THREE.Vector3();
const camTarget = new THREE.Vector3();
function followCamera(dt) {
  const t = actors.cameraTarget; // {x, y, z, yaw}
  const driving = actors.driving === true;
  const dist = driving ? 11 : 7, height = driving ? 4.5 : 3.2;
  const fx = Math.sin(t.yaw), fz = -Math.cos(t.yaw); // actors v002 heading convention
  camPos.set(t.x - fx * dist, (t.y || 0) + height, t.z - fz * dist);
  camera.position.lerp(camPos, Math.min(1, dt * 6));
  camTarget.set(t.x + fx * 6, (t.y || 0) + 1.5, t.z + fz * 6);
  camera.lookAt(camTarget);
}

// ---- loop -------------------------------------------------------------------
let last = performance.now();
let fpsAcc = 0, fpsN = 0, fpsShown = 0;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1; // clamp hitches
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.5) { fpsShown = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  if (!paused) {
    map.update(dt);
    actors.update(dt, controls.state);
    taxiJob.update(dt);
    deliveryJob.update(dt);
    if (marker && marker.visible) marker.rotation.y += dt; // spin marker lightly
    if (deliveryMarker && deliveryMarker.visible) deliveryMarker.rotation.y += dt;
    followCamera(dt);
  }
  if (taxiJob.consumeDirty() | deliveryJob.consumeDirty()) phone.render();
  const kmh = Math.round(Math.abs(actors.current.speed || 0) * 3.6); // v009: speed of the vehicle being driven (taxi/sedan/bike)
  elFps.textContent = fpsShown + ' FPS' + (actors.driving ? ' · ' + kmh + ' km/h' : '');
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// GitHub's web UI can't process these binaries, so the GLBs are committed as .b64 text;
// decode to blob URLs and hand builder 7's loader a subclass that maps the plain paths.
async function glbURL(path) {
  let r = await fetch(path + '.b64');
  let b64 = '';
  if (r.ok) {
    b64 = await r.text();
  } else {
    // big files are committed as numbered parts (240 KB each, GitHub editor limit)
    for (let i = 0; ; i++) {
      const part = await fetch(path + '.b64.0' + i);
      if (!part.ok) { if (i === 0) return path; break; } // a real GLB committed later wins automatically
      b64 += await part.text();
    }
  }
  b64 = b64.replace(/\s+/g, '');
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: 'model/gltf-binary' }));
}
const modelBlobs = {};
for (const p of ['./models/player-vest-cc0.glb', './models/taxi.glb']) modelBlobs[p] = await glbURL(p);
class RepoGLTFLoader extends GLTFLoader {
  loadAsync(url, onProgress) {
    return super.loadAsync(modelBlobs[url] || url, onProgress);
  }
}

// load the CC0 models before hiding the loader (builder 7 v007); report failures, don't fall back silently
try {
  await actors.loadModels({ GLTFLoader: RepoGLTFLoader, baseURL: './models/' });
} catch (err) {
  const el = document.querySelector('#loading .sub');
  if (el) el.textContent = '3D models failed to load (' + (err && err.message ? err.message : 'network') + ') - showing simple shapes';
  await new Promise((r) => setTimeout(r, 2500));
}

document.getElementById('loading').style.display = 'none';
notify('Open the Phone (top right) to find work');
requestAnimationFrame(frame);

</script>
