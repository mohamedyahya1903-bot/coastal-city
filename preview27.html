import * as THREE from 'three';

// ===== map.js =====
function computePropInstances(THREE, proto, list, groundFn) {
  const ONE = new THREE.Vector3(1, 1, 1);
  const up = new THREE.Vector3(0, 1, 0);
  const matrices = [];
  for (const [x, z, rot, h] of list) {
    proto.rotation.y = rot;
    proto.scale.copy(ONE);
    proto.updateMatrixWorld(true);
    const size = new THREE.Box3().setFromObject(proto).getSize(new THREE.Vector3());
    const k = h / size.y;
    proto.scale.setScalar(k);
    proto.updateMatrixWorld(true);
    const box1 = new THREE.Box3().setFromObject(proto);
    const c = box1.getCenter(new THREE.Vector3());
    matrices.push(new THREE.Matrix4().compose(
      new THREE.Vector3(x - c.x, groundFn(x, z) - 0.15 - box1.min.y, z - c.z),
      new THREE.Quaternion().setFromAxisAngle(up, rot),
      new THREE.Vector3(k, k, k),
    ));
  }
  proto.rotation.y = 0;
  proto.scale.copy(ONE);
  proto.updateMatrixWorld(true);
  const meshes = [];
  proto.traverse((o) => { if (o.isMesh) meshes.push({ geometry: o.geometry, material: o.material, rel: o.matrixWorld.clone() }); });
  return { meshes, matrices };
}

function mergeProtoParts(THREE, proto) {
  proto.updateMatrixWorld(true);
  const byMat = new Map(); // key -> { material, geos: [] }
  proto.traverse((o) => {
    if (!o.isMesh) return;
    const m = o.material;
    const key = [m.type, m.color && m.color.getHex(), !!m.map, m.vertexColors, m.transparent, m.opacity, m.side].join('|');
    if (!byMat.has(key)) byMat.set(key, { material: m, geos: [] });
    byMat.get(key).geos.push({ geo: o.geometry, rel: o.matrixWorld });
  });
  const parts = [];
  for (const { material, geos } of byMat.values()) {
    if (geos.length === 1) { // nothing to merge; still bake the local transform
      const g = geos[0].geo.clone().applyMatrix4(geos[0].rel);
      parts.push({ geometry: g, material });
      continue;
    }
    const prepped = geos.map(({ geo, rel }) => {
      const g = (geo.index ? geo.toNonIndexed() : geo.clone());
      g.applyMatrix4(rel);
      return g;
    });
    const attrNames = Object.keys(prepped[0].attributes).filter((n) => prepped.every((g) => g.attributes[n]));
    const merged = new THREE.BufferGeometry();
    for (const name of attrNames) {
      const size = prepped[0].attributes[name].itemSize;
      let total = 0;
      for (const g of prepped) total += g.attributes[name].count;
      const out = new Float32Array(total * size);
      let off = 0;
      for (const g of prepped) { out.set(g.attributes[name].array, off); off += g.attributes[name].array.length; }
      merged.setAttribute(name, new THREE.BufferAttribute(out, size));
    }
    parts.push({ geometry: merged, material });
  }
  return parts;
}

function buildInstancedProps(THREE, proto, list, groundFn, scene) {
  const { matrices } = computePropInstances(THREE, proto, list, groundFn);
  const parts = mergeProtoParts(THREE, proto);
  const made = [];
  for (const { geometry, material } of parts) {
    const im = new THREE.InstancedMesh(geometry, material, matrices.length);
    for (let i = 0; i < matrices.length; i++) im.setMatrixAt(i, matrices[i]);
    im.instanceMatrix.needsUpdate = true;
    im.computeBoundingBox();
    im.computeBoundingSphere(); // instanced bounds: frustum culling stays correct
    im.name = 'inst:' + (proto.name || 'prop');
    im.matrixAutoUpdate = false; // static, like map.js's freeze()
    im.updateMatrix();
    if (scene) scene.add(im);
    made.push(im);
  }
  return made;
}

function buildFoam(THREE, { shoreX = -218, zMin = -320, zMax = 320 } = {}) {
  const NX = 4, NZ = 110, W = 9; // strip spans x in [shoreX - 3.5, shoreX + 3.5]
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= NZ; j++) {
    const z = zMin + (zMax - zMin) * (j / NZ);
    for (let i = 0; i <= NX; i++) {
      const u = i / NX;
      pos.push(shoreX - W / 2 + W * u, 0.03, z); // hugs the sand/water seam (sand y=0, water y=-0.25)
      uv.push(u, j / NZ);
    }
  }
  for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
    const a = j * (NX + 1) + i, b = a + 1, c = a + NX + 1, d = c + 1;
    idx.push(a, c, b, b, c, d); // up-facing (ccw from +Y)
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeBoundingBox();
  geo.computeBoundingSphere(); // exact shoreline bounds: frustum culls it when looking inland
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  const cx = cv.getContext('2d');
  const img = cx.createImageData(64, 64);
  for (let y = 0; y < 64; y++) {
    for (let x = 0; x < 64; x++) {
      const u = x / 63; // 0 = water side, 1 = sand side
      const streak = 0.6 + 0.4 * Math.sin(y * 1.7 + Math.sin(y * 0.31) * 5.0); // wavy along-shore streaks
      const a = Math.pow(Math.max(0, 1 - u), 1.4) * streak + 0.25 * Math.pow(Math.max(0, 1 - Math.abs(u - 0.35) * 3), 2);
      const o = (y * 64 + x) * 4;
      const v = Math.max(0, Math.min(255, Math.round(a * 255)));
      img.data[o] = img.data[o + 1] = img.data[o + 2] = v; // alphaMap reads the GREEN channel
      img.data[o + 3] = 255;
    }
  }
  cx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);

  const uTime = { value: 0 };
  const mat = new THREE.MeshBasicMaterial({
    color: 0xf4fbff, alphaMap: tex, transparent: true, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, // sits on the sand plane
  });
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = uTime;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', [
        '#include <begin_vertex>',
        'float foamEdge = 1.0 - uv.x;', // water side breathes, sand side stays pinned
        'transformed.x += sin(transformed.z * 0.09 + uTime * 1.4) * 1.1 * foamEdge;',
      ].join('\n'));
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <color_fragment>', [
        '#include <color_fragment>',
        'float foamPulse = 0.6 + 0.4 * sin(vAlphaMapUv.y * 80.0 - uTime * 2.0);',
        'diffuseColor.a *= (0.45 + 0.55 * foamPulse);',
      ].join('\n'));
  };
  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = 'fx:foam';
  mesh.renderOrder = 2; // after sand/water, before HUD-ish overlays
  mesh.onBeforeRender = () => { uTime.value = performance.now() / 1000; };
  return mesh;
}

    ['Shop 1',160,210,186,232,8],['Shop 2',160,392,186,414,8],['Cafe',160,296,186,318,8],

  const LOTS = LOTS_L.map((b) => ({ minX: lw(b[1]), maxX: lw(b[3]), minZ: lz(b[2]), maxZ: lz(b[4]) }));
  function baseH(x, z) { // gentle hills; max gradient ~7-8% anywhere (verified in test)

  const HILL_BENCHES = [ // [name, x0,y0,x1,y1] layout

  function terrainH(x, z) { // building pads flatten inside each lot (blended inward): roads keep natural slope
    let h = baseH(x, z);
    for (const L of LOTS) {
      const d = Math.min(x - L.minX, L.maxX - x, z - L.minZ, L.maxZ - z);
      if (d <= 0) continue;
      const w = smooth(d / 6); // pad blend inward only: roads always keep the natural slope

    }
    for (const P of PARK_T) { // v13 BUGFIX: full-rect flatten + 1 m apron (Apartment Lot downhill bays sank)
      const d = Math.min(x - P.minX, P.maxX - x, z - P.minZ, P.maxZ - z);
      if (d >= 0) { h = P.padY; continue; }
      if (d > -1) { const w = smooth(1 + d); h = h * (1 - w) + P.padY * w; }
    }
    for (const P of HILL_T) { // v14: Hillcrest bench pads flat (buildable, <=9% by construction)
      const d = Math.min(x - P.minX, P.maxX - x, z - P.minZ, P.maxZ - z);
      if (d >= 0) { h = P.padY; continue; }
      if (d > -1) { const w = smooth(1 + d); h = h * (1 - w) + P.padY * w; }

  }
  const ocean = new THREE.Mesh(new THREE.PlaneGeometry(300, 680), matWater);
  ocean.rotation.x = -Math.PI / 2; ocean.position.set(-368, -0.25, 0); scene.add(ocean);
  scene.add(buildFoam(THREE, { shoreX: ocean.position.x + 150 }));
  {
    const X0 = -218, X1 = 320, Z0 = -320, Z1 = 320, NX = 60, NZ = 72; // ~8.6k tris (was 15.4k)

  const ROADS = [

function buildVehShell(THREE, root, material) {

    g.applyMatrix4(o.matrixWorld);
    C.set((o.material && o.material.color) ? o.material.color : 0xffffff);

  if (nor.length === pos.length) merged.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  merged.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));

  shell.name = 'veh:shell';
  shell.visible = false;
  return shell;

function createTaxiJob({routes, getVehicle, onChange=()=>{}, initialState=null}) {

  if (initialState && initialState.version===1) {
    if(money(initialState.balance))state.balance=initialState.balance;
    if(money(initialState.completed))state.completed=initialState.completed;
    if(Number.isSafeInteger(initialState.routeIndex)&&initialState.routeIndex>=0)state.routeIndex=initialState.routeIndex%routes.length;
  }

// ===== save.js =====
const KEY = 'coastalcity_save_v1';

function createSave({ getActors, getJobs }) {
  let lastLoaded = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.version !== 1) return null;
      lastLoaded = data;
      return data;
    } catch (e) { return null; }
  }

  function collect() {
    const actors = getActors();
    const jobs = getJobs();
    return {
      version: 1,
      savedAt: Date.now(),
      actors: actors.snapshot(),
      jobs: jobs ? jobs.serialize() : null,
    };
  }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(collect())); }
    catch (e) { /* storage full/blocked: game keeps running */ }
  }

  function restore() {
    if (!lastLoaded) return;
    try {
      if (lastLoaded.actors) getActors().restore(lastLoaded.actors);
    } catch (e) { /* a bad save never blocks a fresh game */ }
  }

  let timer = 0;
  function startAutosave() {
    stopAutosave();
    timer = setInterval(persist, 1000); // 1 s autosave, standing rule
  }
  function stopAutosave() { if (timer) clearInterval(timer); timer = 0; }

  return { load, collect, persist, restore, startAutosave, stopAutosave };
}

function createAdaptiveResolution({ renderer, min = 0.5, max = 1.25, start = 1 }) { // v3 (gfxfps round 8): floor 0.6 -> 0.5; one more shed step (0.55 -> 0.5) before quality collapse on slow phones

  let cooldown = 0;
  let warm = 30;

  function apply() {
    renderer.setPixelRatio(cur);
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  renderer.setPixelRatio(cur);

  return {
    sample(dt) {
      const d = dt > 0.25 ? 0.25 : dt; // clamp one-off hitches
      ema = ema * 0.95 + d * 0.05;
      if (warm > 0) { warm--; return; }
      cooldown -= dt;
      if (cooldown > 0) return;
      if (ema > 1 / 33 && cur > min) {
        cur = Math.max(min, Math.round((cur - 0.15) * 100) / 100);
        apply();
        cooldown = 1.5;
      } else if (ema < 1 / 57 && cur < max) {
        cur = Math.min(max, Math.round((cur + 0.1) * 100) / 100);
        apply();
        cooldown = 1.5;
      }

    get current() { return cur; },
  };
}

        ratio: adaptive && adaptive.current,
        modules: perModule(),

          out.fps = Math.round(frames / ((performance.now() - t0) / 1000));

      };

    });

  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: 'model/gltf-binary' }));
}
const modelBlobs = {};
for (const p of ['./models/player-vest-cc0.glb', './models/taxi.glb']) modelBlobs[p] = await glbURL(p);
class RepoGLTFLoader extends GLTFLoader {
  loadAsync(url, onProgress) {
    return super.loadAsync(modelBlobs[url] || url, onProgress);
  }
}
try {
  await actors.loadModels({ GLTFLoader: RepoGLTFLoader, baseURL: './models/' });
} catch (err) {
  const el = document.querySelector('#loading .sub');
  if (el) el.textContent = '3D models failed to load (' + (err && err.message ? err.message : 'network') + ') - showing simple shapes';
  await new Promise((r) => setTimeout(r, 2500));
}

document.getElementById('loading').style.display = 'none';
notify('Open the Phone (top right) to find work');
requestAnimationFrame(frame);

</script>
